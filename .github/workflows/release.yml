name: Release

# Creates a GitHub release from main, with the version from pyproject.toml: moves the changelog
# fragments into CHANGELOG.md, commits that to main, builds and tags that commit. Run it by hand, then
# run Publish to send the release to PyPI.
on: workflow_dispatch

jobs:
  checks:
    name: Check what is about to be released
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Runs the project's code, so it gets read-only permissions.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      UV_LOCKED: '1'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Decide what is being released
        id: version
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::a release is cut from main, not from $GITHUB_REF_NAME"
            exit 1
          fi
          version="$(uv version --short)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released; raise the version in pyproject.toml first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check there are release notes
        run: |
          if ! compgen -G "changelog.d/*.md" >/dev/null; then
            echo "::error::nothing to release: changelog.d/ has no fragments"
            exit 1
          fi
          just changelog  # the entry this release will get

      - name: Check formatting and style
        run: just lint

      - name: Check types
        run: just type

      - name: Run tests
        run: just test

  release:
    name: Build and publish the release
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write          # commit the changelog, create the tag and the release
      id-token: write          # sign the build provenance
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      UV_LOCKED: '1'
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: true  # the job pushes the changelog commit to main

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Move the release notes into the changelog
        run: |
          just changelog > notes.md  # the entry, as towncrier renders it: the release's text
          just release-notes         # towncrier stages CHANGELOG.md and the removed fragments
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "release $VERSION"
          git push origin HEAD:main  # fails if main moved since the checks: run the release again

      - name: Build the distributions
        run: just build

      - name: Attest what was built
        uses: actions/attest-build-provenance@v4
        with:
          # `uv build` also writes dist/.gitignore; sign only the packages.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish the release
        run: |
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz \
            --target "$(git rev-parse HEAD)" --notes-file notes.md
