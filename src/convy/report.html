<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent report</title>
<style>
:root {
  --page: #f5f6f8; --surface: #ffffff; --ink: #1b1f27; --muted: #667085; --rule: #e3e6eb;
  --pass: #15803d; --fail: #c0362c; --none: #98a2b3; --focus: #3557d4; --pick: #eef2fd;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #111318; --surface: #171a21; --ink: #e6e8ec; --muted: #9aa3b2; --rule: #2a2f3a;
    --pass: #3fb873; --fail: #f07167; --none: #6b7280; --focus: #8da2fb; --pick: #1e2433;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
.page { max-width: 1440px; margin: 0 auto; padding: 24px 16px 48px; }
header { margin-bottom: 24px; }
.eyebrow { font: 600 12px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 8px; font-weight: 650; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
.context { color: var(--muted); margin: 0; }
.context b { color: var(--ink); font-weight: 550; }
.id { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
tr:last-child > td { border-bottom: 0; }
thead th { font-size: 12px; font-weight: 550; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
.best { font-weight: 650; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.rate { font-size: 20px; font-weight: 650; line-height: 1.1; }

/* Attempt marks: the shape tells the verdict, the colour only repeats it. */
.marks { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mark { display: inline-grid; place-items: center; width: 12px; height: 12px; font: 800 16px/1 system-ui, sans-serif; }
.mark.pass::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pass); }
.mark.none::before { content: ""; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--none); }
.mark.fail { color: var(--fail); }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
.legend .marks { margin-right: 4px; }

.workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
@media (min-width: 1100px) {
  .workspace { grid-template-columns: minmax(0, 3fr) minmax(400px, 2fr); }
  aside.panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
}
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
input[type=search] {
  font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 10px; width: 200px;
}
.group-row th { font-size: 12px; font-weight: 550; color: var(--muted); background: var(--page); padding-top: 8px; padding-bottom: 8px; }
.matrix td { padding: 4px 8px; }
.matrix td:first-child { padding-left: 16px; padding-top: 10px; }
button.cell {
  all: unset; box-sizing: border-box; display: block; width: 100%; min-width: 120px; cursor: pointer;
  padding: 6px 8px; border-radius: 6px;
}
button.cell:hover { background: var(--pick); }
button.cell[aria-pressed=true] { background: var(--pick); box-shadow: inset 0 0 0 1px var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.cell .sub { margin-top: 3px; }

aside .body { padding: 16px; }
.hint { color: var(--muted); margin: 0; }
.claims { margin: 6px 0 0; padding-left: 18px; }
.claims li { margin: 2px 0; }
.attempt { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 14px; }
.verdict { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.verdict strong { font-weight: 650; }
.reason { margin: 8px 0 12px; padding: 8px 12px; border-left: 3px solid var(--rule); white-space: pre-wrap; }
.reason.pass { border-color: var(--pass); } .reason.fail { border-color: var(--fail); } .reason.none { border-color: var(--none); }
.turn { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 10px; margin: 10px 0; }
.role { font: 600 11px/1.9 var(--mono); color: var(--muted); text-transform: uppercase; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.agent .text { background: var(--page); border-radius: 6px; padding: 6px 10px; }
.turn .sub { grid-column: 2; }
.warn { color: var(--fail); }
.empty { padding: 32px 16px; color: var(--muted); }
@media print { aside.panel { position: static; max-height: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">convy</div>
    <h1>Agent report</h1>
    <p class="context" id="context"></p>
  </header>
  <section class="panel" aria-labelledby="agents-title">
    <div class="panel-head"><h2 id="agents-title">Agents</h2><span class="muted" id="agents-note"></span></div>
    <div class="scroll"><table id="agents"></table></div>
  </section>
  <div class="workspace">
    <section class="panel" aria-labelledby="scenarios-title">
      <div class="panel-head">
        <h2 id="scenarios-title">Scenarios</h2>
        <div class="tools">
          <input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text">
          <div class="legend" aria-hidden="true">
            <span><span class="marks"><span class="mark pass"></span></span>passed</span>
            <span><span class="marks"><span class="mark fail">✕</span></span>failed</span>
            <span><span class="marks"><span class="mark none"></span></span>no verdict</span>
          </div>
        </div>
      </div>
      <div class="scroll"><table class="matrix" id="matrix"></table></div>
    </section>
    <aside class="panel" aria-live="polite"><div class="body" id="details"></div></aside>
  </div>
</div>
<script>
// Everything that comes from the data is added as text, never as HTML.
const DATA = __DATA__;

const STOPS = {
  user_stop: "the user finished", max_turns: "the turns ran out",
  agent_failure: "agent error", model_failure: "convy's model failed",
};
const VERDICTS = {pass: "Passed", fail: "Failed", none: "No verdict"};

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key.startsWith("aria-") || key.startsWith("data-")) node.setAttribute(key, value);
    else node[key] = value;
  }
  node.append(...children.filter(child => child != null));  // strings become text nodes
  return node;
}
const kind = passed => passed == null ? "none" : passed ? "pass" : "fail";
const mark = (passed, title) => el("span", {className: `mark ${kind(passed)}`, title: title ?? VERDICTS[kind(passed)]}, kind(passed) === "fail" ? "✕" : "");
const version = g => g.version && g.version !== g.agent ? g.version : null;
const tokens = n => n == null ? "—" : n < 1000 ? String(Math.round(n))
  : n < 1e6 ? `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}k` : `${(n / 1e6).toFixed(n < 1e7 ? 2 : 1)}M`;
const exact = n => n == null ? "not reported" : Math.round(n).toLocaleString("en");
const seconds = s => s == null ? "—" : s < 10 ? `${s.toFixed(1)} s` : `${Math.round(s)} s`;
const percent = r => `${Math.round(r * 100)}%`;
const when = iso => new Date(iso).toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"});
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const key = (scenario, group) => `${scenario}|${group}`;
// The attempts the summary counts: those of complete runs, as in its pass rate.
const counted = group => DATA.scenarios.flatMap(scenario => (DATA.cells[key(scenario, group.id)]?.attempts ?? [])
  .filter(a => a.complete).map(a => ({...a, scenario})));

function renderContext() {
  const attempts = Object.values(DATA.cells).reduce((sum, cell) => sum + cell.attempts.length, 0);
  const latest = DATA.groups.map(g => g.started).sort().at(-1);
  const models = field => [...new Set(DATA.groups.map(g => g[field]))].join(", ");
  const counts = [plural(DATA.groups.length, "agent"), plural(DATA.scenarios.length, "scenario"), plural(attempts, "attempt")];
  const facts = counts.map(text => [el("b", {}, text)]);
  if (latest) {
    facts.push(["last run ", el("b", {}, when(latest))]);
    const [user, judge] = [models("user"), models("judge")];
    if (user === judge) facts.push(["user and judge ", el("b", {className: "id"}, user)]);
    else facts.push(["user ", el("b", {className: "id"}, user)], ["judge ", el("b", {className: "id"}, judge)]);
  }
  document.getElementById("context").replaceChildren(...facts.flatMap((fact, i) => i ? [" · ", ...fact] : fact));
}

function renderAgents() {
  const table = document.getElementById("agents");
  if (!DATA.groups.length) {
    table.replaceWith(el("p", {className: "empty"}, "No runs yet. Run ", el("span", {className: "id"}, "convy run <agent>"), " and the results appear here."));
    return;
  }
  const several = DATA.groups.length > 1;
  const best = (pick, better) => {
    const values = DATA.groups.map(pick).filter(v => v != null);
    return values.length ? values.reduce((a, b) => better(a, b) ? a : b) : null;
  };
  const top = {
    passed: best(g => g.passed?.mean, (a, b) => a >= b), input: best(g => g.input, (a, b) => a <= b),
    seconds: best(g => g.seconds, (a, b) => a <= b), turn: best(g => g.turn_mean, (a, b) => a <= b),
  };
  const cls = (value, bestValue, extra = "n") => `${extra}${several && value != null && value === bestValue ? " best" : ""}`;
  const head = el("thead", {}, el("tr", {},
    el("th", {}, "Agent"), el("th", {}, "Passed"), el("th", {}, "Attempts"),
    el("th", {className: "n", title: "The agent's own tokens, mean per scenario"}, "Tokens per scenario"),
    el("th", {className: "n"}, "Time per scenario"), el("th", {className: "n"}, "Answer time"),
    el("th", {}, "Problems")));
  const rows = DATA.groups.map(g => {
    const attempts = counted(g);
    const judged = attempts.filter(a => a.passed != null);
    const range = g.passed && g.runs > 1 && g.passed.min !== g.passed.max
      ? `${percent(g.passed.min)}–${percent(g.passed.max)} across runs` : null;
    const problems = [
      g.agent_failures && plural(g.agent_failures, "agent error"),
      g.model_failures && `${plural(g.model_failures, "model failure")} (left out)`,
      g.stopped && `${plural(g.stopped, "stopped run")} (left out)`,
    ].filter(Boolean);
    return el("tr", {},
      el("td", {}, el("span", {className: "id"}, g.agent), version(g) ? el("span", {className: "sub"}, version(g)) : null),
      el("td", {className: cls(g.passed?.mean, top.passed, "")},
        el("span", {className: "rate"}, g.passed ? percent(g.passed.mean) : "—"),
        el("span", {className: "sub"}, range ?? (g.passed ? null : g.stopped === g.runs ? "no complete run" : "no verdicts"))),
      attempts.length ? el("td", {},
        el("span", {className: "marks"}, ...attempts.map(a => mark(a.passed, `${a.scenario} #${a.attempt}: ${VERDICTS[kind(a.passed)]}`))),
        el("span", {className: "sub"}, `${judged.filter(a => a.passed).length} passed of ${judged.length} judged`))
        : el("td", {className: "muted"}, "—"),
      el("td", {className: cls(g.input, top.input), title: `input ${exact(g.input)}, output ${exact(g.output)}`},
        g.input == null ? el("span", {className: "muted"}, "not reported") : tokens(g.input),
        g.input == null ? null : el("span", {className: "sub"}, `in · ${tokens(g.output)} out`)),
      el("td", {className: cls(g.seconds, top.seconds)}, seconds(g.seconds)),
      el("td", {className: cls(g.turn_mean, top.turn)}, seconds(g.turn_mean),
        g.turn_mean == null ? null : el("span", {className: "sub"}, `mean · ${seconds(g.turn_max)} max`)),
      el("td", {className: problems.length ? "warn" : "muted"}, problems.length ? problems.join(", ") : "none"));
  });
  table.replaceChildren(head, el("tbody", {}, ...rows));
  document.getElementById("agents-note").textContent = several ? "Bold marks the best value in a column" : "";
}

function differs(scenario) {
  const rates = new Set(DATA.groups.map(g => DATA.cells[key(scenario, g.id)])
    .filter(cell => cell && cell.judged).map(cell => cell.passed / cell.judged));
  return rates.size > 1;
}

let selected = decodeURIComponent(location.hash.slice(1));

function renderMatrix() {
  const table = document.getElementById("matrix");
  if (!DATA.groups.length) { table.closest(".workspace").hidden = true; return; }
  const mask = document.getElementById("filter").value.trim() || "*";
  const pattern = new RegExp("^" + mask.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
  const shown = DATA.scenarios.filter(s => pattern.test(s));
  const head = el("thead", {}, el("tr", {}, el("th", {}, "Scenario"),
    ...DATA.groups.map(g => el("th", {}, el("span", {className: "id"}, g.agent), version(g) ? el("span", {className: "sub"}, version(g)) : null))));
  const row = scenario => el("tr", {}, el("td", {className: "id"}, scenario), ...DATA.groups.map(g => {
    const cell = DATA.cells[key(scenario, g.id)];
    if (!cell) return el("td", {className: "muted"}, "—");
    const pick = key(scenario, g.id);
    const button = el("button", {
      className: "cell", type: "button", "aria-pressed": String(pick === selected),
      "aria-label": `${g.agent} ${version(g) ?? ""} on ${scenario}: ${cell.passed} of ${cell.judged} judged attempts passed`,
    }, el("span", {className: "marks"}, ...cell.attempts.map(a => mark(a.passed, `attempt ${a.attempt}: ${VERDICTS[kind(a.passed)]}`))),
      el("span", {className: "sub"}, cell.input == null ? seconds(cell.seconds) : `${seconds(cell.seconds)} · ${tokens(cell.input)} tokens`));
    button.addEventListener("click", () => select(pick));
    return el("td", {}, button);
  }));
  const section = (title, scenarios) => scenarios.length ? [
    el("tr", {className: "group-row"}, el("th", {colSpan: DATA.groups.length + 1}, `${title} · ${scenarios.length}`)),
    ...scenarios.map(row)] : [];
  const differing = shown.filter(differs);
  const body = DATA.groups.length > 1
    ? [...section("Results differ", differing), ...section("Same result for every agent", shown.filter(s => !differing.includes(s)))]
    : shown.map(row);
  table.replaceChildren(head, el("tbody", {}, ...(body.length ? body
    : [el("tr", {}, el("td", {className: "muted", colSpan: DATA.groups.length + 1}, `No scenario matches ${mask}`))])));
}

function select(pick) {
  selected = pick;
  history.replaceState(null, "", "#" + encodeURIComponent(pick));
  renderMatrix();
  renderDetails();
}

function renderDetails() {
  const details = document.getElementById("details");
  const cell = DATA.cells[selected];
  if (!cell) {
    details.replaceChildren(el("p", {className: "hint"},
      "Select a result in the table to read the dialogue and the judge's reasoning."));
    return;
  }
  const [scenario, groupId] = selected.split("|");
  const group = DATA.groups.find(g => g.id === groupId);
  const claims = cell.attempts[0].claims;
  details.replaceChildren(
    el("div", {className: "eyebrow"}, version(group) ? `${group.agent} · ${version(group)}` : group.agent),
    el("h2", {className: "id"}, scenario),
    el("p", {className: "muted", style: "margin:12px 0 0"}, "The judge checks that"),
    el("ul", {className: "claims"}, ...claims.map(claim => el("li", {}, claim))),
    ...cell.attempts.map(renderAttempt));
}

function renderAttempt(a) {
  const k = kind(a.passed);
  return el("section", {className: "attempt", "aria-label": `Attempt ${a.attempt}`},
    el("div", {className: "verdict"},
      el("span", {className: "marks"}, mark(a.passed)), el("strong", {}, VERDICTS[k]),
      el("span", {className: "muted"}, [`attempt ${a.attempt}`, STOPS[a.stop] ?? a.stop, seconds(a.seconds),
        a.input == null ? null : `${tokens(a.input)} in, ${tokens(a.output)} out`].filter(Boolean).join(" · "))),
    el("div", {className: `reason ${k}`}, a.reason || "The judge gave no reason."),
    ...a.turns.flatMap(t => [
      el("div", {className: "turn user"}, el("span", {className: "role"}, "User"), el("div", {className: "text"}, t.user)),
      el("div", {className: "turn agent"}, el("span", {className: "role"}, "Agent"), el("div", {className: "text"}, t.agent),
        el("span", {className: "sub", title: `input ${exact(t.input)}, output ${exact(t.output)}`},
          t.input == null ? seconds(t.seconds) : `${seconds(t.seconds)} · ${tokens(t.input)} in, ${tokens(t.output)} out`)),
    ]),
    el("p", {className: "sub"}, a.complete ? null : el("span", {className: "warn"}, "From a run that stopped early. "), "Journal ", el("span", {className: "id"}, a.run)));
}

document.getElementById("filter").addEventListener("input", renderMatrix);
renderContext();
renderAgents();
renderMatrix();
renderDetails();
</script>
</body>
</html>
