<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent runs</title>
<style>
:root {
  --page: #f5f6f8; --surface: #ffffff; --ink: #1b1f27; --muted: #667085; --rule: #e3e6eb;
  --pass: #15803d; --fail: #c0362c; --none: #98a2b3; --focus: #3557d4; --pick: #eef2fd;
  --better: #e7f6ec; --worse: #fbeae8;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #111318; --surface: #171a21; --ink: #e6e8ec; --muted: #9aa3b2; --rule: #2a2f3a;
    --pass: #3fb873; --fail: #f07167; --none: #6b7280; --focus: #8da2fb; --pick: #1e2433;
    --better: #16301f; --worse: #3a1d1b;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
.page { max-width: 1440px; margin: 0 auto; padding: 24px 16px 48px; }
header { margin-bottom: 24px; }
.eyebrow { font: 600 12px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
.eyebrow a { color: inherit; }
h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 8px; font-weight: 650; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
h3 { font-size: 13px; margin: 0 0 6px; font-weight: 650; color: var(--muted); }
.context { color: var(--muted); margin: 0; }
.id { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.scroll { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: var(--surface); }
thead th { font-size: 12px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.matrix th:first-child, .matrix td:first-child { position: sticky; left: 0; z-index: 1; border-right: 1px solid var(--rule); min-width: 200px; }
.matrix td.run, .matrix th.run { min-width: 150px; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.rate { font-size: 18px; font-weight: 650; line-height: 1.1; }
.summary th { font-size: 12px; font-weight: 550; color: var(--muted); }
.group-row th { font-size: 12px; font-weight: 550; color: var(--muted); background: var(--page); }
.better-text { color: var(--pass); } .worse-text { color: var(--fail); }
.warn { color: var(--fail); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); }

/* Attempt marks: the shape tells the verdict, the colour only repeats it. */
.marks { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mark { display: inline-grid; place-items: center; width: 12px; height: 12px; font: 800 16px/1 system-ui, sans-serif; }
.mark.pass::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pass); }
.mark.none::before { content: ""; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--none); }
.mark.fail { color: var(--fail); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
input[type=search], select {
  font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--rule);
  border-radius: 6px; padding: 5px 10px;
}
input[type=search] { width: 200px; }

button.cell, button.row {
  all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 4px 6px; border-radius: 6px;
}
button.cell:hover, button.row:hover { background: var(--pick); }
td.better { background: var(--better); } td.worse { background: var(--worse); }
.delta { font: 600 12px/1 var(--mono); color: var(--muted); margin-left: 6px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.empty { padding: 32px 16px; color: var(--muted); }

dialog {
  width: calc(100vw - 48px); height: calc(100vh - 48px); max-width: none; max-height: none;
  padding: 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
.window { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; }
.window-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
.close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
.close:hover { background: var(--pick); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px; border-bottom: 1px solid var(--rule); }
.strip button { all: unset; cursor: pointer; display: grid; gap: 4px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); white-space: nowrap; }
.strip button[aria-pressed=true] { background: var(--pick); border-color: var(--focus); }
.window-body { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(0, 3fr); min-height: 0; }
.side { padding: 16px 20px; border-right: 1px solid var(--rule); overflow: auto; }
.main { padding: 16px 20px; overflow: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.claims { margin: 0 0 16px; padding-left: 20px; }
.claims li { margin: 4px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.tabs [role=tab] { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--rule); }
.tabs [role=tab][aria-selected=true] { background: var(--pick); border-color: var(--focus); }
.compare { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.columns { display: grid; grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr)); gap: 24px; }
.decision { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; margin: 6px 0; }
.decision .why { grid-column: 2; color: var(--muted); }
.error { margin: 8px 0 12px; padding: 8px 12px; border-left: 3px solid var(--fail); white-space: pre-wrap; overflow-wrap: anywhere; }
.turn { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 2px 10px; margin: 10px 0; }
.role { font: 600 11px/1.9 var(--mono); color: var(--muted); text-transform: uppercase; }
.agent .text { background: var(--page); border-radius: 6px; padding: 6px 10px; }
.turn .sub { grid-column: 2; }
details { margin-top: 8px; }
@media (max-width: 800px) {
  .window-body { grid-template-columns: minmax(0, 1fr); overflow: auto; }
  .side, .main { overflow: visible; }
  .side { border-right: 0; border-bottom: 1px solid var(--rule); }
  .columns { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow"><a href="../index.html">convy</a> / runs</div>
    <h1 id="agent"></h1>
    <p class="context" id="context"></p>
  </header>
  <section class="panel" aria-labelledby="runs-title">
    <div class="panel-head">
      <h2 id="runs-title">Runs and scenarios</h2>
      <div class="tools">
        <input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text">
        <div class="legend" aria-hidden="true">
          <span><span class="marks"><span class="mark pass"></span></span> passed</span>
          <span><span class="marks"><span class="mark fail">✕</span></span> failed</span>
          <span><span class="marks"><span class="mark none"></span></span> no verdict</span>
          <span>Δ an older version of the scenario</span>
          <span>· not played</span>
        </div>
      </div>
    </div>
    <div class="scroll" id="scroll"><table class="matrix" id="matrix"></table></div>
  </section>
</div>
<dialog id="window" aria-labelledby="window-title"></dialog>
<script>
// Every number and decision comes from the data; this script only draws them.
// Everything that comes from the data is added as text, never as HTML.
const DATA = __DATA__;

const STOPS = {
  user_stop: "the user finished", max_turns: "the turns ran out",
  agent_failure: "agent error", model_failure: "convy's model failed",
};
const VERDICTS = {pass: "Passed", fail: "Failed", none: "No verdict"};
const CHANGES = {
  better: "better", worse: "worse", noise: "within noise", few: "too few scenarios to tell",
};

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key.startsWith("aria-") || key.startsWith("data-") || key === "role") node.setAttribute(key, value);
    else node[key] = value;
  }
  node.append(...children.flat(Infinity).filter(child => child != null && child !== false));
  return node;
}
const kind = passed => passed == null ? "none" : passed ? "pass" : "fail";
const mark = (passed, title) => el("span", {className: `mark ${kind(passed)}`, title: title ?? VERDICTS[kind(passed)]}, kind(passed) === "fail" ? "✕" : "");
const marks = cell => el("span", {className: "marks"}, cell.attempts.map(a => mark(a.passed, `attempt ${a.attempt}: ${VERDICTS[kind(a.passed)]}`)));
const tokens = n => n == null ? "—" : n < 1000 ? String(Math.round(n))
  : n < 1e6 ? `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}k` : `${(n / 1e6).toFixed(n < 1e7 ? 2 : 1)}M`;
const exact = n => n == null ? "not reported" : Math.round(n).toLocaleString("en");
const seconds = s => s == null ? "—" : s < 10 ? `${s.toFixed(1)} s` : `${Math.round(s)} s`;
const percent = r => `${Math.round(r * 100)}%`;
const points = r => `${Math.round(Math.abs(r) * 100)}`;
const when = iso => new Date(iso).toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"});
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const key = (scenario, run) => `${scenario}@${run}`;
const runById = id => DATA.runs.find(run => run.id === id);

function renderHeader() {
  document.getElementById("agent").textContent = DATA.agent;
  document.title = `${DATA.agent} · convy`;
  const latest = DATA.runs.at(-1);
  document.getElementById("context").textContent = latest
    ? `${plural(DATA.runs.length, "run")} · ${plural(DATA.scenarios.length, "scenario")} · latest ${when(latest.started)}`
    : "No runs yet.";
}

function runHead(run) {
  const status = run.status === "finished" ? null
    : el("span", {className: "badge warn"}, run.status === "interrupted" ? "interrupted" : "not finished");
  const models = run.models_changed
    ? el("span", {className: "badge warn", title: `user ${run.user}, judge ${run.judge}`}, "⚠ models changed") : null;
  return el("th", {className: "run", title: `run ${run.id}\nuser ${run.user}\njudge ${run.judge}`},
    when(run.started),
    el("span", {className: "sub"}, run.version ? `version ${run.version}` : `run ${run.short}`),
    status, models);
}

function summaryRows() {
  const row = (title, cell) => el("tr", {className: "summary"}, el("th", {}, title),
    DATA.runs.map(run => el("td", {className: "run"}, cell(run))));
  return [
    row("Passed", run => [
      el("span", {className: "rate"}, run.passed == null ? "—" : percent(run.passed)),
      run.margin == null ? null : el("span", {className: "delta"}, `±${points(run.margin)}`),
      run.change == null ? null : el("span", {
        className: `sub ${run.change.verdict === "better" ? "better-text" : run.change.verdict === "worse" ? "worse-text" : ""}`,
        title: `over ${plural(run.change.scenarios, "scenario")} played unchanged in both runs`,
      }, `${run.change.delta > 0 ? "▲" : run.change.delta < 0 ? "▼" : "="} ${points(run.change.delta)} pts · ${CHANGES[run.change.verdict]}`),
    ]),
    row(`Passed all attempts`, run => run.k > 1 && run.counted
      ? [percent(run.steady / run.counted), el("span", {className: "sub"}, `${run.steady} of ${plural(run.counted, "scenario")} · k = ${run.k}`)]
      : el("span", {className: "muted"}, run.k > 1 ? "—" : "one attempt each")),
    row("Scenarios", run => `${run.played} of ${DATA.scenarios.length}`),
    row("Tokens per attempt", run => run.input == null ? el("span", {className: "muted"}, "not reported")
      : el("span", {title: `input ${exact(run.input)}, output ${exact(run.output)}`}, tokens(run.input),
        el("span", {className: "sub"}, `in · ${tokens(run.output)} out`))),
    row("Answer time", run => [seconds(run.turn_mean),
      run.turn_mean == null ? null : el("span", {className: "sub"}, `mean · ${seconds(run.turn_max)} max`)]),
    row("Problems", run => {
      const problems = [
        run.agent_failures && plural(run.agent_failures, "agent error"),
        run.model_failures && `${plural(run.model_failures, "model failure")} (left out)`,
        run.unreadable && plural(run.unreadable, "unreadable line"),
      ].filter(Boolean);
      return el("span", {className: problems.length ? "warn" : "muted"}, problems.length ? problems.join(", ") : "none");
    }),
  ];
}

function scenarioRow(scenario) {
  const newest = [...DATA.runs].reverse().find(run => DATA.cells[key(scenario, run.id)]);
  const open = el("button", {className: "row id", type: "button", "aria-label": `Open ${scenario}`}, scenario);
  open.addEventListener("click", () => select(scenario, newest.id));
  return el("tr", {}, el("th", {}, open), DATA.runs.map(run => {
    const cell = DATA.cells[key(scenario, run.id)];
    if (!cell) return el("td", {className: "run muted", title: "not played in this run"}, "·");
    const button = el("button", {
      className: "cell", type: "button",
      "aria-label": `${scenario} in the run of ${when(run.started)}: ${cell.attempts.filter(a => a.passed).length} of ${plural(cell.attempts.length, "attempt")} passed`,
    }, marks(cell), cell.changed ? el("span", {className: "delta", title: "the scenario differs from its newest version"}, "Δ") : null,
      cell.attempts.length ? null : el("span", {className: "sub"}, "no attempts yet"));
    button.addEventListener("click", () => select(scenario, run.id));
    return el("td", {className: `run ${cell.tint}`}, button);
  }));
}

function renderMatrix() {
  const table = document.getElementById("matrix");
  if (!DATA.runs.length) {
    table.replaceWith(el("p", {className: "empty"}, "No runs yet. Run ", el("span", {className: "id"}, "convy run <agent>"), " and the results appear here."));
    return;
  }
  const mask = document.getElementById("filter").value.trim() || "*";
  const pattern = new RegExp("^" + mask.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
  const shown = DATA.scenarios.filter(s => pattern.test(s));
  const span = DATA.runs.length + 1;
  const section = (title, scenarios) => scenarios.length
    ? [el("tr", {className: "group-row"}, el("th", {colSpan: span}, `${title} · ${scenarios.length}`)), scenarios.map(scenarioRow)] : [];
  const changed = shown.filter(s => DATA.changed.includes(s));
  const rest = shown.filter(s => !DATA.changed.includes(s));
  const body = changed.length
    ? [...section("Changed in the latest run", changed), ...section("Other scenarios", rest)]
    : rest.map(scenarioRow);
  table.replaceChildren(
    el("thead", {}, el("tr", {}, el("th", {}, "Run started"), DATA.runs.map(runHead))),
    el("tbody", {}, summaryRows()),
    el("tbody", {}, body.length ? body : el("tr", {}, el("td", {className: "muted", colSpan: span}, `No scenario matches ${mask}`))));
}

// The window: one scenario, one run at a time, chosen by the address.
const dialog = document.getElementById("window");
let selected = null;  // {scenario, run, attempt, compare}

function select(scenario, run) {
  selected = {scenario, run, attempt: 0, compare: ""};
  history.replaceState(null, "", "#" + encodeURIComponent(key(scenario, run)));
  renderWindow();
  if (!dialog.open) dialog.showModal();
}

function fromAddress() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const at = hash.lastIndexOf("@");  // a scenario id may hold an @; a run id never does
  if (at < 0 || !DATA.cells[hash]) return;
  select(hash.slice(0, at), hash.slice(at + 1));
}

dialog.addEventListener("close", () => {
  selected = null;
  history.replaceState(null, "", location.pathname + location.search);
});

function attemptColumn(cell, number) {
  const attempt = cell.attempts.find(a => a.attempt === number) ?? cell.attempts[0];
  if (!attempt) return el("div", {}, el("p", {className: "muted"}, "No attempts recorded in this run."));
  const run = runById(cell.run);
  return el("div", {},
    el("h3", {}, `${when(run.started)} · attempt ${attempt.attempt}`),
    el("p", {className: "muted"}, [VERDICTS[kind(attempt.passed)], STOPS[attempt.stop] ?? attempt.stop, seconds(attempt.seconds),
      attempt.input == null ? null : `${tokens(attempt.input)} in, ${tokens(attempt.output)} out`].filter(Boolean).join(" · ")),
    attempt.error ? el("div", {className: "error"}, attempt.error) : null,
    attempt.claims.map(claim => el("div", {className: "decision"},
      claim.passed == null ? el("span", {className: "muted"}, "–") : mark(claim.passed),
      el("span", {}, claim.text),
      claim.reason ? el("span", {className: "why"}, claim.reason) : null)),
    attempt.turns.map(t => [
      el("div", {className: "turn user"}, el("span", {className: "role"}, "User"), el("div", {className: "text"}, t.user)),
      el("div", {className: "turn agent"}, el("span", {className: "role"}, "Agent"), el("div", {className: "text"}, t.agent),
        el("span", {className: "sub", title: `input ${exact(t.input)}, output ${exact(t.output)}`},
          t.input == null ? seconds(t.seconds) : `${seconds(t.seconds)} · ${tokens(t.input)} in, ${tokens(t.output)} out`)),
    ]));
}

function renderWindow() {
  const {scenario, run} = selected;
  const cell = DATA.cells[key(scenario, run)];
  const played = DATA.runs.filter(r => DATA.cells[key(scenario, r.id)]);
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());

  const strip = el("div", {className: "strip", role: "group", "aria-label": "Runs that played the scenario"},
    played.map(r => {
      const button = el("button", {type: "button", "aria-pressed": String(r.id === run)},
        el("span", {}, when(r.started)), marks(DATA.cells[key(scenario, r.id)]));
      button.addEventListener("click", () => select(scenario, r.id));
      return button;
    }));

  const earlier = cell.earlier ? DATA.cells[key(scenario, cell.earlier)] : null;
  const side = el("div", {className: "side"},
    el("h3", {}, "The user"), el("p", {className: "text"}, cell.user),
    el("h3", {}, "Claims"), el("ol", {className: "claims"}, cell.claims.map(c => el("li", {}, c))),
    el("p", {className: "muted"}, `at most ${plural(cell.max_turns, "turn")}`),
    cell.revised ? el("details", {},
      el("summary", {}, `Δ changed since ${when(runById(cell.earlier).started)}`),
      el("h3", {}, "The user"), el("p", {className: "text"}, earlier.user),
      el("h3", {}, "Claims"), el("ol", {className: "claims"}, earlier.claims.map(c => el("li", {}, c)))) : null);

  const numbers = cell.attempts.map(a => a.attempt);
  const current = numbers[selected.attempt] ?? numbers[0];
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"},
    cell.attempts.map((a, i) => {
      const tab = el("button", {type: "button", role: "tab", "aria-selected": String(i === selected.attempt)},
        mark(a.passed), `Attempt ${a.attempt}`);
      tab.addEventListener("click", () => { selected.attempt = i; renderWindow(); });
      return tab;
    }));
  const others = played.filter(r => r.id !== run);
  if (others.length) {
    const choice = el("select", {"aria-label": "Compare with a run"},
      el("option", {value: ""}, "nothing"),
      others.map(r => el("option", {value: r.id, selected: r.id === selected.compare}, when(r.started))));
    choice.addEventListener("change", () => { selected.compare = choice.value; renderWindow(); });
    tabs.append(el("label", {className: "compare"}, "Compare with", choice));
  }
  const compared = selected.compare ? DATA.cells[key(scenario, selected.compare)] : null;
  const columns = el("div", {className: "columns", style: `--columns: ${compared ? 2 : 1}`},
    attemptColumn(cell, current), compared ? attemptColumn(compared, current) : null);

  dialog.replaceChildren(el("div", {className: "window"},
    el("div", {className: "window-head"},
      el("div", {}, el("div", {className: "eyebrow"}, DATA.agent), el("h2", {className: "id", id: "window-title"}, scenario)),
      close),
    strip,
    el("div", {className: "window-body"}, side, el("div", {className: "main"}, tabs, columns))));
}

document.getElementById("filter").addEventListener("input", renderMatrix);
window.addEventListener("hashchange", fromAddress);
renderHeader();
renderMatrix();
const scroll = document.getElementById("scroll");
scroll.scrollLeft = scroll.scrollWidth;  // the newest run is on the right
fromAddress();
</script>
</body>
</html>
