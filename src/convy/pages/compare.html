<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparison</title>
<link rel="icon" href="data:image/svg+xml,/*include icon.svg*/">
<style>
/*include base.css*/
/*include window.css*/
.delta { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--pass); } .delta.bad { color: var(--fail); } .delta.same, .delta.noise, .delta.none { color: var(--muted); }
.tile .s.good { color: var(--pass); } .tile .s.bad { color: var(--fail); }
.tally .good { color: var(--pass); } .tally .bad { color: var(--fail); }
.group td { padding: 16px 12px 6px; font-size: 13px; font-weight: 650; cursor: default; }
.arrow { color: var(--muted); padding: 0 6px; }
.tab.plain { padding-left: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.colhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
.colhead .badge { margin-left: auto; }
.cols .msg { max-width: 100%; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.changes { --tail: 22ch; }
.chart .dev { position: relative; height: 16px; }
.chart .dev::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); }
.chart .dbar { position: absolute; top: 4px; height: 8px; border-radius: 3px; }
.dbar.bad { background: var(--fail); } .dbar.good { background: var(--pass); } .dbar.same { background: var(--muted); }
.chart .clip { position: absolute; top: -1px; font-weight: 800; color: var(--muted); } .clip.up { right: -2px; } .clip.down { left: -2px; }
.pair { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.pair .delta { font-size: 13px; }
.tile .stats .delta { font-size: 12.5px; }
#tokens { --tail: 24ch; }
#tokens .n small.block { display: block; }
#tokens > .chart:last-child:nth-child(odd) { grid-column: 1 / -1; }
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <section id="tiles" aria-label="Before and after in numbers"></section>
  <div id="switch"></div>
  <section id="changes" class="charts changes" aria-label="Changes by scenario"></section>
  <section id="tokens" class="charts" aria-label="Tokens by turn and by part, before and after"></section>
  <div class="tools"><h2>Scenarios</h2><input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text"></div>
  <div class="panel scroll" id="table"></div>
</div>
<dialog class="window" id="window" aria-labelledby="window-title"></dialog>
<script>
/*include window.js*/

// The comparison: two runs' tiles, their scenarios grouped by what changed, and the window.
const DATA = __DATA__;
const BEFORE = DATA.before, AFTER = DATA.after, WAS = DATA.was, NOW = DATA.now, D = DATA.deltas;
const GROUPS = {worse: "Worse", better: "Better", same: "Same", apart: "Not compared"};

function header() {
  const title = BEFORE.agent === AFTER.agent ? BEFORE.agent : `${BEFORE.agent} vs ${AFTER.agent}`;
  const tag = (word, run) => el("span", {className: "badge none", style: "padding-left:10px"}, `${word} ${run.short} · ${when(run.started)}${atTrust(run.trust)}`);
  return el("div", {className: "top"},
    el("div", {},
      el("div", {className: "eyebrow"}, el("a", {href: "../index.html"}, "CONVY"), " / compare"),
      el("h1", {}, title),
      el("p", {className: "meta", style: "display:flex;flex-wrap:wrap;align-items:center;gap:8px"}, tag("Before", BEFORE), el("span", {className: "arrow"}, "→"), tag("After", AFTER),
        DATA.differences.length ? el("span", {style: "color:var(--fail);font-weight:600"}, `differences: ${DATA.differences.join(", ")}`) : el("span", {}, "same models, convy version and agent limit"))),
    themeButton());
}

const percentagePoints = v => `${v < 10 ? v.toFixed(1) : Math.round(v)} percentage points`;

// A change: an arrow and a number in the metric's own unit; colour and "~" come from the data; "=" only for no change at all.
function change(delta, unit) {
  if (delta.tone === "none") return el("span", {className: "delta none"}, "—");
  if (delta.tone === "same" && !delta.value) return el("span", {className: "delta same"}, "=");
  const arrow = delta.value > 0 ? "▲" : "▼";
  const text = `${delta.tone === "noise" ? "~ " : ""}${arrow} ${unit(Math.abs(delta.value))}`;
  return el("span", {className: `delta ${delta.tone}`, title: delta.tone === "noise" ? "within noise" : null}, text);
}

// The share of input read from the cache, before and after, coloured by its change; no line when
// neither run reports it.
function cached() {
  if (WAS.cached == null && NOW.cached == null) return null;
  if (WAS.cached == null || NOW.cached == null) return el("span", {className: "s"}, "from cache: not reported");
  const title = D.cached.value ? percentagePoints(Math.abs(D.cached.value)) : null;
  return el("span", {className: `s ${D.cached.tone}`, title}, `from cache ${pct(WAS.cached)} → ${pct(NOW.cached)}`);
}

function tiles() {
  const tile = (label, value, was, delta, {hero = false, extra = null} = {}) => el("div", {className: hero ? "tile hero" : "tile"},
    el("span", {className: "l"}, label), el("span", {className: "v"}, value), el("span", {className: "s"}, was), delta, extra);
  const was = (spread, unit) => spread ? `was ${STATS.map(k => unit(spread[k])).join(" · ")}` : "was —";
  return [
    el("div", {className: "tiles"},
      tile("Pass rate", pct(NOW.rate), `was ${pct(WAS.rate)} · now ${NOW.passed} of ${NOW.judged}${notTrusted(NOW.cut)}`, change(D.rate, percentagePoints), {hero: true}),
      tile("Stable scenarios", [String(NOW.stable), el("small", {}, `of ${AFTER.scenarios}`)], `was ${WAS.stable} of ${BEFORE.scenarios}`, change(D.stable, v => String(v))),
      tile("Errors", String(NOW.errors), `was ${WAS.errors}`, change(D.errors, v => String(v)))),
    el("div", {className: "tiles two"},
      spreadTile("Time per answer", NOW.seconds, secs, [was(WAS.seconds, secs)], k => change(D.seconds[k], secs)),
      spreadTile("Tokens per attempt", NOW.tokens, count, [was(WAS.tokens, count), cached()], k => change(D.tokens[k], count))),
  ];
}

// The change block: per compared scenario a bar from zero on a fixed −100%…+100% scale, its length
// the change of the chosen statistic; a longer change is clipped with › and its text keeps the value.
const byId = new Map(DATA.rows.map(r => [r.id, r]));
function changes(title, order, field, value, unit) {
  const {keep} = filtered();
  const rows = order.filter(keep).map(id => byId.get(id)).map(r => {
    const d = r[field][stat], size = Math.min(Math.abs(d.value), 100) / 2;
    const sign = d.value > 0 ? "+" : d.value < 0 ? "−" : "";
    return el("div", {className: "rrow"},
      el("span", {className: "rid mono", title: r.id}, r.id),
      el("span", {className: "dev", "aria-hidden": "true"},
        el("span", {className: `dbar ${d.tone}`, style: `left: ${d.value > 0 ? "50%" : `calc(50% - max(2px, ${size}%))`}; width: max(2px, ${size}%)`}),
        Math.abs(d.value) > 100 && el("span", {className: `clip ${d.value > 0 ? "up" : "down"}`}, d.value > 0 ? "›" : "‹")),
      el("span", {className: "n"}, el("span", {className: `delta ${d.tone}`}, `${sign}${Math.round(Math.abs(d.value))}%`),
        el("small", {className: "muted"}, ` · ${unit(value(r.before))} → ${unit(value(r.after))}`)));
  });
  const scale = el("div", {}, el("div", {className: "scale"}, el("span"), el("span", {}, el("span", {}, "better"), el("span", {}, "0"), el("span", {}, "worse")), el("span")),
    el("p", {className: "caption"}, `The bar is the change of the scenario's ${STAT[stat]}, from −100% to +100%; grey under 5%.`));
  return chart(title, rows, scale, draw);
}

// Tokens by part before and after: two thin bars per compared scenario on one scale, the mean
// tokens per attempt and the share of the input read from the cache as text.
const thousands = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const share = p => p.cached == null ? "not reported" : !(p.cached + p.input) ? "—" : `${pct(p.cached / (p.cached + p.input))} cached`;
function partPairs() {
  const {keep} = filtered();
  const rows = DATA.by_parts.filter(keep).map(id => byId.get(id));
  const top = Math.max(0, ...rows.flatMap(r => [r.before.tokens.mean, r.after.tokens.mean]));
  return chart("Tokens per attempt by part · mean · before and after", rows.map(r => el("div", {className: "rrow", title: `${r.id}: before ${partText(r.before.parts)}; after ${partText(r.after.parts)}`},
      el("span", {className: "rid mono", title: r.id}, r.id),
      el("span", {className: "ptrack", "aria-hidden": "true"}, partBar(r.before.parts, r.before.tokens.mean, top, true), partBar(r.after.parts, r.after.tokens.mean, top, true)),
      el("span", {className: "n"}, `${thousands(r.before.tokens.mean)} → ${thousands(r.after.tokens.mean)}`,
        (r.before.parts.cached != null || r.after.parts.cached != null) && el("small", {className: "muted block"}, `${share(r.before.parts)} → ${share(r.after.parts)}`)))),
    [scaleLine(count(top)), partLegend(rows.flatMap(r => [r.before.parts, r.after.parts])),
      el("p", {className: "caption"}, "Per scenario the bar before, then the bar after.")], draw);
}

const passedChange = v => v > 0 ? `${v} more passed` : v < 0 ? `${-v} fewer passed` : "=";

function table() {
  const {mask, keep} = filtered();
  const shown = DATA.rows.filter(r => keep(r.id));
  const body = [];
  for (const group of Object.keys(GROUPS)) {
    const rows = shown.filter(r => r.group === group);
    if (!rows.length) continue;
    body.push(el("tr", {className: "group"}, el("td", {colSpan: 4}, `${GROUPS[group]} · ${rows.length}`)));
    for (const r of rows) {
      const open = el("button", {className: "open", type: "button", "aria-label": `Open ${r.id}`}, r.id);
      const metric = (now, was) => [now, el("small", {}, was)];
      const row = el("tr", {className: "row"}, el("td", {}, open),
        el("td", {}, el("span", {className: "pair"},
            r.before ? squares(attemptMarks(r.before.attempts), "Before", null, n => show(r.id, n)) : el("span", {className: "muted"}, "—"),
            el("span", {className: "arrow"}, "→"),
            r.after ? squares(attemptMarks(r.after.attempts), "After", null, n => show(r.id, n)) : el("span", {className: "muted"}, "—"),
            r.held.value != null && el("span", {className: `delta ${r.held.tone}`}, passedChange(r.held.value))),
          r.why && el("div", {className: "muted", style: "font-size:12.5px;margin-top:4px"}, r.why)),
        el("td", {className: "n metric"}, r.why ? "—" : metric(secs(chosen(r.after.seconds)), `was ${secs(chosen(r.before.seconds))}`)),
        el("td", {className: "n metric"}, r.why ? "—" : metric(count(chosen(r.after.tokens)), `was ${count(chosen(r.before.tokens))}`)));
      row.addEventListener("click", () => show(r.id, 1));
      body.push(row);
    }
  }
  return el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Scenario"), el("th", {}, "Attempts · before → after"), el("th", {className: "n"}, `Time per answer · ${STAT[stat]}`), el("th", {className: "n"}, `Tokens per attempt · ${STAT[stat]}`))),
    el("tbody", {}, body.length ? body : el("tr", {}, el("td", {className: "empty", colSpan: 4}, `No scenario matches ${mask}`))));
}

const dialog = document.getElementById("window");
dialog.addEventListener("close", clearAddress);

function column(word, run, view, number) {
  if (!view) return el("div", {}, el("div", {className: "colhead"}, el("strong", {}, `${word} · ${run.short}`)), el("p", {className: "empty"}, "This run did not play the scenario."));
  const attempt = view.attempts.find(a => a.attempt === number) ?? view.attempts[0];
  return el("div", {},
    el("div", {className: "colhead"}, el("strong", {}, `${word} · ${run.short}`), el("span", {className: "muted"}, when(run.started)),
      attempt ? (attempt.cut ? badge("none", {none: "Not trusted"}) : badge(kind(attempt.passed), ATTEMPT)) : null),
    attempt ? [attemptTiles(attempt), judgeLines(attempt, run), dialogue(attempt)] : el("p", {className: "empty"}, "No attempts recorded."));
}

function show(id, number) {
  const r = byId.get(id);
  if (!r) return;
  address(id, number);
  const view = r.after ?? r.before;
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());
  const most = Math.max(r.before ? r.before.attempts.length : 0, r.after ? r.after.attempts.length : 0, 1);
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"}, Array.from({length: most}, (_, i) => {
    const tab = el("button", {className: "tab plain", type: "button", role: "tab", "aria-selected": String(i + 1 === number)}, `Attempt ${i + 1}`);
    tab.addEventListener("click", () => { show(id, i + 1); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); });
    return tab;
  }));
  const claims = r.claims.length
    ? el("ol", {className: "claims"}, r.claims.map((c, i) => el("li", {}, el("span", {className: "no"}, String(i + 1)), icon(c.after), el("span", {}, c.text),
        el("span", {className: "tally"}, c.change === "unchanged" ? "unchanged" : [icon(c.before), "→", icon(c.after), c.change === "worse" ? "got worse" : "got better"],
          c.moved !== "unchanged" && el("span", {className: c.moved === "worse" ? "bad" : "good"}, `· ${c.was} → ${c.now}`)))))
    : el("p", {className: "told muted"}, r.why || "No claims to compare.");
  dialog.replaceChildren(el("div", {className: "frame"},
    el("div", {className: "whead"}, el("h2", {id: "window-title"}, r.id),
      r.before ? badge(r.before.result) : null, r.before && r.after ? el("span", {className: "arrow"}, "→") : null, r.after ? badge(r.after.result) : null,
      el("span", {className: "muted"}, `${BEFORE.short} → ${AFTER.short}`), close),
    el("div", {className: "wbody"},
      el("div", {className: "side"}, el("div", {className: "sec"}, "Claims · before → after"), claims,
        el("div", {className: "sec"}, "The user was told"), el("p", {className: "told"}, view.user)),
      el("div", {className: "main"}, tabs, el("div", {className: "cols"}, column("Before", BEFORE, r.before, number), column("After", AFTER, r.after, number))))));
  if (!dialog.open) dialog.showModal();
}

function draw() {
  document.getElementById("changes").replaceChildren(
    changes(`Time per answer · ${STAT[stat]}`, DATA.by_seconds[stat], "seconds", v => chosen(v.seconds), secs),
    changes(`Tokens per attempt · ${STAT[stat]}`, DATA.by_tokens[stat], "tokens", v => chosen(v.tokens), count));
  const turns = DATA.turns.length > 1, top = turnTop(DATA.turns.flatMap(p => [p.before, p.after].filter(Boolean)));
  document.getElementById("tokens").replaceChildren(...[
    turns && turnChart(`Tokens by turn · ${STAT[stat]} per answer · before ${BEFORE.short}`, DATA.turns.map(p => p.before ?? {turn: p.turn}), top),
    turns && turnChart(`Tokens by turn · ${STAT[stat]} per answer · after ${AFTER.short}`, DATA.turns.map(p => p.after ?? {turn: p.turn}), top),
    DATA.by_parts.length > 0 && partPairs()].filter(Boolean));
  document.getElementById("table").replaceChildren(table());
}

document.title = `${BEFORE.short} → ${AFTER.short} · convy`;
document.getElementById("head").replaceChildren(header());
document.getElementById("tiles").replaceChildren(...tiles());
document.getElementById("switch").replaceChildren(statSwitch(draw));
document.getElementById("filter").addEventListener("input", draw);
draw();
const opened = fromAddress();
if (opened) show(opened.id, opened.attempt);
</script>
</body>
</html>
