<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run</title>
<style>
/*include base.css*/
/*include window.css*/
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <section id="tiles" aria-label="The run in numbers"></section>
  <div class="tools"><h2>Scenarios</h2><input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text"></div>
  <div class="panel scroll" id="table"></div>
  <p class="hint" id="hint"></p>
</div>
<dialog class="window" id="window" aria-labelledby="window-title"></dialog>
<script>
/*include window.js*/

// The run's page: its tiles, its scenarios, and the window of one scenario.
const DATA = __DATA__;
const RUN = DATA.run, M = DATA.metrics;

function header() {
  const status = STATUS[RUN.status];
  return el("div", {className: "top"},
    el("div", {},
      el("div", {className: "eyebrow"}, el("a", {href: "../../index.html"}, "CONVY"), ` / ${RUN.agent} / ${RUN.short}`),
      el("h1", {}, `Run ${when(RUN.started)}`),
      el("p", {className: "meta"}, [RUN.version && `version ${RUN.version}`, `${plural(RUN.scenarios, "scenario")} × ${plural(RUN.k, "attempt")}`, status,
        RUN.unreadable && plural(RUN.unreadable, "unreadable line")].filter(Boolean).join(" · "))),
    themeButton());
}

function tiles() {
  const tile = (label, value, detail, hero = false) => el("div", {className: hero ? "tile hero" : "tile"}, el("span", {className: "l"}, label), el("span", {className: "v"}, value), el("span", {className: "s"}, detail));
  return el("div", {className: "tiles"},
    tile("Pass rate", pct(M.rate), `${M.passed} of ${plural(M.judged, "attempt")}`, true),
    tile("Stable scenarios", [String(M.stable), el("small", {}, `of ${RUN.scenarios}`)], RUN.k > 1 ? "passed every attempt" : "one attempt each"),
    tile("Answer time", M.seconds == null ? "—" : [secs(M.seconds).replace(" s", ""), el("small", {}, "s")], M.slowest == null ? "no answers" : `mean · slowest ${secs(M.slowest)}`),
    tile("Tokens per attempt", count(M.tokens), M.tokens == null ? "not reported" : `${count(M.input)} in · ${count(M.output)} out`),
    tile("Errors", String(M.errors), `agent ${M.agent_errors} · models ${M.model_errors}`));
}

function table() {
  const {mask, keep} = filtered();
  const rows = DATA.scenarios.filter(s => keep(s.id)).map(s => {
    const open = el("button", {className: "open", type: "button", "aria-label": `Open ${s.id}`}, s.id);
    const row = el("tr", {className: "row"},
      el("td", {}, open), el("td", {}, badge(s.result)),
      el("td", {className: "n metric"}, secs(s.seconds), el("small", {}, s.slowest == null ? "" : `slowest ${secs(s.slowest)}`)),
      el("td", {className: "n metric"}, count(s.tokens), el("small", {}, s.tokens == null ? "not reported" : `${count(s.input)} in · ${count(s.output)} out`)));
    row.addEventListener("click", () => show(s.id, 1));
    return row;
  });
  return el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Scenario"), el("th", {}, "Result"), el("th", {className: "n"}, "Answer time"), el("th", {className: "n"}, "Tokens per attempt"))),
    el("tbody", {}, rows.length ? rows : el("tr", {}, el("td", {className: "empty", colSpan: 4}, `No scenario matches ${mask}`))));
}

const dialog = document.getElementById("window");
dialog.addEventListener("close", clearAddress);

function show(id, number) {
  const s = DATA.scenarios.find(item => item.id === id);
  if (!s) return;
  const attempt = s.attempts.find(a => a.attempt === number) ?? s.attempts[0];
  address(id, attempt ? attempt.attempt : 1);
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"}, s.attempts.map(a => {
    const tab = el("button", {className: "tab", type: "button", role: "tab", "aria-selected": String(a === attempt)}, icon(kind(a.passed)), `Attempt ${a.attempt}`);
    tab.addEventListener("click", () => { show(id, a.attempt); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); });
    return tab;
  }));
  dialog.replaceChildren(el("div", {className: "frame"},
    el("div", {className: "whead"}, el("h2", {id: "window-title"}, s.id), badge(s.result),
      el("span", {className: "muted"}, `run ${RUN.short} · ${when(RUN.started)} · at most ${plural(s.max_turns, "turn")}`), close),
    el("div", {className: "wbody"},
      el("div", {className: "side"},
        el("div", {className: "sec"}, "The user was told"), el("p", {className: "told"}, s.user),
        el("div", {className: "sec"}, `Claims · ${plural(s.attempts.length, "attempt")}`),
        el("ol", {className: "claims"}, s.claims.map((c, i) => el("li", {}, el("span", {className: "no"}, String(i + 1)), icon(c.result), el("span", {}, c.text), el("span", {className: "tally"}, claimTally(c)))))),
      el("div", {className: "main"},
        attempt ? [tabs, attemptTiles(attempt), el("div", {className: "sec"}, "The judge"), judgeLines(attempt), el("div", {className: "sec"}, "The dialogue"), dialogue(attempt)]
          : el("p", {className: "empty"}, "No attempts recorded yet.")))));
  if (!dialog.open) dialog.showModal();
}

function draw() {
  document.getElementById("table").replaceChildren(table());
}

document.title = `${RUN.agent} · run ${RUN.short} · convy`;
document.getElementById("head").replaceChildren(header());
document.getElementById("tiles").replaceChildren(tiles());
document.getElementById("filter").addEventListener("input", draw);
document.getElementById("hint").textContent = `Compare with another run: convy compare <run> ${RUN.short}`;
draw();
const opened = fromAddress();
if (opened) show(opened.id, opened.attempt);
</script>
</body>
</html>
