<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run</title>
<link rel="icon" href="data:image/svg+xml,/*include icon.svg*/">
<style>
/*include base.css*/
/*include window.css*/
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
.tiles.five { grid-template-columns: minmax(0, 2.2fr) repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .tiles.five { grid-template-columns: repeat(4, minmax(0, 1fr)); } .tiles.five > :first-child { grid-column: 1 / -1; } }
@media (max-width: 640px) { .tiles.five { grid-template-columns: repeat(2, minmax(0, 1fr)); } .controls { justify-content: flex-start; } }
.tile .s.bad { color: var(--fail); }
.tiles.five .tile .v { font-size: clamp(44px, 4vw, 60px); line-height: 1.05; margin: 2px 0 4px; }
/* every tile is a label, a number and a foot on rows the tiles share: the numbers line up, the feet
   start together, and a short foot sits at the bottom beside the pass rate's line; on one row */
@media (min-width: 1101px) {
  .tiles.five { grid-auto-rows: auto auto 1fr; }
  .tiles.five .tile { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 3px; }
  .tiles.five .tile:not(.rates) .foot { align-self: end; }
}
.foot { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tiles.five .tile .v small { font-size: 18px; }
.tiles.five .tile .s { font-size: 13px; }
.meter { display: flex; gap: 2px; height: 8px; margin: 8px 0 4px; }
.meter > span { min-width: 3px; border-radius: 2px; }
.meter .passing { background: var(--pass); } .meter .failing { background: var(--fail); } .meter .none { background: var(--none-bg); }
.tiles.five .tile .v .frac { font-size: .6em; font-weight: 650; color: var(--muted); margin-left: 14px; letter-spacing: -.01em; }

/* the scenarios by pass rate on one line, and where the tokens and time go */
.rates .meter { height: 24px; margin: 4px 0 6px; }
.rates .cap { margin-top: 12px; }
.rates .meter > span { display: grid; place-items: center; color: #fff; font: 700 12px/1 var(--sans); font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgb(0 0 0 / .45); overflow: hidden; }
.rates .meter .flaky { background: var(--flaky); }
.rates .meter .none { background: var(--none); }
.rates .endlist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 12.5px; color: var(--muted); }
.rates .endlist li { display: inline-flex; align-items: center; gap: 5px; }
.rates .endlist b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.key.passing { background: var(--pass); } .key.failing { background: var(--fail); } .key.flaky { background: var(--flaky); } .key.none { background: var(--none); }
#charts { grid-template-columns: minmax(0, 1fr); }
.chart .cat { display: grid; grid-template-columns: minmax(0, 26ch) minmax(0, 1fr) 7ch; gap: 2px 12px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.chart .cat:hover { background: var(--side); }
.chart .cat.own { cursor: default; }
.chart .cat .cname { display: flex; flex-direction: column; min-width: 0; }
.chart .cat .cname b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart .cat .cname small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart .cat .n { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.chart .cat .ptrack { display: flex; flex-direction: row; justify-content: flex-start; align-items: center; min-height: 16px; }
.chart .cat .fill { display: block; height: 12px; min-width: 2px; border-radius: 2px 4px 4px 2px; background: color-mix(in srgb, var(--muted) 75%, var(--surface)); }
.chart .cat[aria-expanded] .cname b::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 7px 2px 1px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; }
.chart .cat[aria-expanded="true"] .cname b::before { transform: rotate(45deg); }
@media (prefers-reduced-motion: reduce) { .chart .cat .cname b::before { transition: none; } }
.chart.cats .scale { grid-template-columns: minmax(0, 26ch) minmax(0, 1fr) 7ch; }
.places { list-style: none; margin: 2px 0 8px 12px; padding: 0; display: grid; gap: 2px; font-size: 12.5px; }
.places li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.places .open { color: var(--focus); font-size: 12.5px; }
.places .open:hover { text-decoration: underline; }
@media (max-width: 760px) { .chart .cat, .chart.cats .scale { grid-template-columns: minmax(0, 1fr) 7ch; } .chart .cat .cname { grid-column: 1 / -1; } .chart.cats .scale > span:first-child { display: none; } .places { margin-left: 0; } }
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <section id="tiles" aria-label="The run in numbers"></section>
  <section id="charts" class="charts" aria-label="Tokens and time by category"></section>
  <div class="tools" id="scenarios-head"><h2>Scenarios</h2><input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text"></div>
  <div class="panel scroll" id="table"></div>
  <p class="hint" id="hint"></p>
</div>
<dialog class="window" id="window" aria-labelledby="window-title"></dialog>
<script>
/*include window.js*/

// The run's page: its tiles, how its scenarios did and where its time and tokens went, its scenarios, and the window of one scenario.
const DATA = __DATA__;
const RUN = DATA.run, M = DATA.metrics;

// The numbers are means of the answers kept: every answer, or those of the scenarios none of whose
// answers is over a percentile of time or tokens. The address keeps the cut as cut=p95; every
// answer is not written.
const CUTS = {all: "None", p99: "Over P99", p95: "Over P95", p90: "Over P90"};
const MEANS = {all: "Every scenario counts.", p99: "A scenario with an answer in the slowest or largest 1% is cut.", p95: "A scenario with an answer in the slowest or largest 5% is cut.", p90: "A scenario with an answer in the slowest or largest 10% is cut."};
let trim = CUTS[readAddress().get("cut")] ? readAddress().get("cut") : "all";
delete kept.stat;
stat = "mean";
kept.cut = () => trim === "all" ? null : trim;
const view = () => DATA.views[trim];

// The cut, in the page's header beside the theme.
function cutSwitch() {
  const buttons = Object.entries(CUTS).map(([key, word]) => {
    const button = el("button", {type: "button", "aria-pressed": String(key === trim), title: MEANS[key]}, word);
    button.addEventListener("click", () => {
      trim = key;
      buttons.forEach(other => other.setAttribute("aria-pressed", String(other === button)));
      writeAddress(readAddress());
      draw();
    });
    return button;
  });
  return el("div", {className: "switch"}, el("span", {"aria-hidden": "true"}, "Cut outliers"), el("div", {role: "group", "aria-label": "Cut outliers"}, buttons));
}

function header() {
  const status = STATUS[RUN.status];
  return el("div", {className: "top"},
    el("div", {},
      el("div", {className: "eyebrow"}, el("a", {href: "../../index.html"}, "CONVY"), ` / ${RUN.agent} / ${RUN.short}`),
      el("h1", {}, `Run ${when(RUN.started)}`),
      el("p", {className: "meta"}, [RUN.version && `version ${RUN.version}`, `${plural(RUN.scenarios, "scenario")} × ${plural(RUN.k, "attempt")}`, status, RUN.trust > 0 && `trust ${RUN.trust}`,
        RUN.unreadable && plural(RUN.unreadable, "unreadable line")].filter(Boolean).join(" · ")),
    ),
    el("div", {className: "controls"}, cutSwitch(), themeButton()));
}

// The tiles: the pass rate, the flaky scenarios, the errors, and the chosen statistic of the time
// and tokens per answer.
function tiles() {
  // Every tile alike: its label, its number, then what it counts; the numbers line up.
  const top = (label, value) => [el("span", {className: "l"}, label), el("span", {className: "v"}, value)];
  const tile = (label, value, ...rest) => el("div", {className: "tile"}, top(label, value), el("div", {className: "foot"}, rest));
  const open = M.attempts - M.judged;
  const errors = [[M.agent_errors, "agent failure"], [M.busy, "busy agent"], [M.model_errors, "model failure"]].filter(([n]) => n).map(([n, w]) => plural(n, w)).join(" · ");
  const V = view(), answers = V.seconds.answers;
  const cut = V.out.length ? ` · ${plural(V.out.length, "scenario")} cut` : "";
  const measured = (label, m, unit, note) => tile(label, unit(chosen(m.spread)), el("span", {className: "s"}, `mean of ${note}${cut}`));
  return el("div", {className: "tiles five"},
    el("div", {className: "tile rates"}, top("Pass rate", [pct(M.rate), el("span", {className: "frac"}, `${M.passed} / ${M.judged}`)]),
      el("div", {className: "foot"}, el("span", {className: "s"}, `attempts passed${notTrusted(M.cut)}${open ? ` · ${open} without a verdict` : ""}`), rates())),
    tile("Flaky scenarios", String(M.flaky),
      el("span", {className: "s"}, RUN.k > 1 ? "with passed and failed attempts" : "one attempt each: none can be flaky")),
    tile("Errors", String(M.errors), el("span", {className: "s"}, errors || "none failed")),
    measured("Time per answer", V.seconds, secs, plural(answers, "answer")),
    measured("Tokens per answer", V.tokens, count, V.tokens.answers === answers ? plural(answers, "answer") : `the ${V.tokens.answers} of ${answers} answers that report tokens`));
}

// The scenarios by pass rate on one line, from 0: a part per rate as long as how many scenarios
// have it, those without a verdict last; under it, the rate of each part and its count. Pointing
// at a part only lights it up.
function rates() {
  const total = DATA.results.reduce((sum, r) => sum + r.scenarios.length, 0);
  const name = r => r.rate == null ? "no verdict" : pct(r.rate);
  return [el("span", {className: "s cap"}, "Scenarios by pass rate"), el("div", {className: "meter", role: "img", "aria-label": DATA.results.map(r => `${name(r)}: ${plural(r.scenarios.length, "scenario")}`).join(", ")},
      DATA.results.map(r => el("span", {className: r.result, style: `flex: ${r.scenarios.length}`}, r.scenarios.length / total >= .04 ? String(r.scenarios.length) : ""))),
    el("ul", {className: "endlist"}, DATA.results.map(r => el("li", {}, el("i", {className: `key ${r.result}`}), r.rate == null ? "no verdict" : `${name(r)} passed`, el("b", {}, String(r.scenarios.length)))))];
}

// Where the answers' tokens or time went, by category: the answer itself and each call name. A
// bar is what it adds to an answer on average, its total over every answer kept, so the bars rank
// as their totals; a call opens to its largest calls, each a way to the answer that made it.
const PLACES = 5;
const unfolded = new Set();  // the categories opened, by "<title>:<name>"; `every` keeps those showing all
function categories(title, list, unit, own, ownNote, empty) {
  if (!list.length || (list.length === 1 && list[0].name == null && !list[0].parts)) return el("section", {className: "chart", "aria-label": title}, el("h3", {}, title), el("p", {className: "empty"}, empty));
  const a = axis(Math.max(0, ...list.map(c => c.average))), at = v => a.top ? v / a.top * 100 : 0;
  const all = list.reduce((sum, c) => sum + c.total, 0);
  const rows = list.flatMap(c => {
    const key = `${title}:${c.name}`, open = unfolded.has(key), v = c.average;
    const name = c.name ?? own;
    const row = el("div", {className: c.name == null ? "cat own" : "cat", role: c.name == null ? null : "button", tabIndex: c.name == null ? null : 0, "aria-expanded": c.name == null ? null : String(open),
        "data-tip": `${name} · ${unit(v)} per answer on average, ${unit(c.total)} in all · in the ${plural(c.answers, "answer")} it is in: ${spreadWords(c.spread, unit)}`},
      el("span", {className: "cname"}, el("b", {className: c.name == null ? null : "mono", title: name}, name),
        el("small", {}, [`${pct(all ? c.total / all : null)} of all`, c.calls && plural(c.calls, "call"), `in ${plural(c.answers, "answer")}`].filter(Boolean).join(" · "))),
      el("span", {className: "ptrack"}, c.parts ? partBar(c.parts, v, a.top, false, `${name} · `, "answer") : el("span", {className: "fill", style: `width: ${at(v)}%`})),
      el("span", {className: "n"}, unit(v)));
    if (c.name == null) return [row];
    const toggle = () => { open ? unfolded.delete(key) : unfolded.add(key); draw(); document.querySelector(`.cat[data-key="${CSS.escape(key)}"]`)?.focus(); };
    row.dataset.key = key;
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); } });
    if (!open) return [row];
    const showAll = every.has(key), shown = c.places.slice(0, showAll ? c.places.length : PLACES);
    const more = c.places.length > PLACES && el("button", {className: "more", type: "button"}, showAll ? "Show fewer" : `Show all ${c.places.length}`);
    if (more) more.addEventListener("click", () => { showAll ? every.delete(key) : every.add(key); draw(); });
    return [row, el("ol", {className: "places"}, shown.map(p => {
      const go = el("button", {className: "open", type: "button"}, `${p.scenario} · attempt ${p.attempt} · turn ${p.turn + 1}`);
      go.addEventListener("click", () => { show(p.scenario, p.attempt); reveal(p.turn, p.step); });
      return el("li", {}, go, el("span", {className: "muted"}, `${secs(p.seconds)}${p.tokens == null ? "" : ` · ${count(p.tokens)} tokens`}`));
    }), more && el("li", {}, more))];
  });
  const lead = list[0];
  const section = lede(el("section", {className: "chart grid cats", style: gridStyle(a), "aria-label": title}, el("h3", {}, `${title} · per answer on average`),
    list.some(c => c.parts) && partLegend(list.filter(c => c.parts).map(c => c.parts)),
    rows, scaleLine(a, unit), el("p", {className: "caption"}, `${own}: ${ownNote}.`)), list.length > 1 && `Most: ${lead.name ?? own}, ${pct(all ? lead.total / all : null)} of the ${title.startsWith("Time") ? "time" : "tokens"}`);
  return section;
}

const spreadWords = (d, unit) => `min ${unit(d.min)} · P50 ${unit(d.p50)} · P90 ${unit(d.p90)} · max ${unit(d.max)} · n ${d.n}`;

function table() {
  const {mask, keep} = filtered();
  const V = view();
  const rows = DATA.scenarios.map((s, i) => [s, V.scenarios[i]]).filter(([s]) => keep(s.id) && !V.out.includes(s.id)).map(([s, n]) => {
    const open = el("button", {className: "open", type: "button", "aria-label": `Open ${s.id}`}, s.id);
    const under = (d, unit) => d == null ? "" : `max ${unit(d.max)}`;
    const row = el("tr", {className: "row"},
      el("td", {}, open), el("td", {}, badge(s.result)),
      el("td", {}, squares(attemptMarks(s.attempts), "Attempts", null, k => show(s.id, k))),
      el("td", {className: "n metric"}, secs(chosen(n.seconds)), el("small", {}, under(n.seconds, secs))),
      el("td", {className: "n metric"}, count(chosen(n.tokens)), el("small", {}, n.tokens == null ? "not reported" : under(n.tokens, count))));
    row.addEventListener("click", () => show(s.id, 1));
    return row;
  });
  return el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Scenario"), el("th", {}, "Result"), el("th", {}, "Attempts"), el("th", {className: "n"}, "Time per answer · mean"), el("th", {className: "n"}, "Tokens per answer · mean"))),
    el("tbody", {}, rows.length ? rows : el("tr", {}, el("td", {className: "empty", colSpan: 5}, `No scenario matches ${mask}`))));
}

const dialog = document.getElementById("window");
dialog.addEventListener("close", clearAddress);

function show(id, number) {
  const s = DATA.scenarios.find(item => item.id === id);
  if (!s) return;
  const attempt = s.attempts.find(a => a.attempt === number) ?? s.attempts[0];
  address(id, attempt ? attempt.attempt : 1);
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"}, s.attempts.map(a => {
    const tab = el("button", {className: "tab", type: "button", role: "tab", "aria-selected": String(a === attempt)}, icon(kind(a.passed)), `Attempt ${a.attempt}`);
    tab.addEventListener("click", () => { show(id, a.attempt); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); });
    return tab;
  }));
  dialog.replaceChildren(el("div", {className: "frame"},
    el("div", {className: "whead"}, el("h2", {id: "window-title"}, s.id), badge(s.result),
      el("span", {className: "muted"}, `run ${RUN.short} · ${when(RUN.started)} · at most ${plural(s.max_turns, "turn")}`), close),
    el("div", {className: "wbody"},
      el("div", {className: "side"},
        el("div", {className: "sec"}, "The user was told"), el("p", {className: "told"}, s.user),
        el("div", {className: "sec"}, `Claims · ${plural(s.attempts.length, "attempt")}`),
        el("ol", {className: "claims"}, s.claims.map((c, i) => el("li", {}, el("span", {className: "no"}, String(i + 1)), icon(c.result), el("span", {}, c.text),
          el("span", {className: "tally"}, squares(claimMarks(s.attempts, i), "Decisions", attempt && attempt.attempt, n => { show(id, n); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); }), claimTally(c)))))),
      el("div", {className: "main"},
        attempt ? [tabs, attemptTiles(attempt), el("div", {className: "sec"}, "The judge"), judgeLines(attempt, RUN), el("div", {className: "sec"}, "The dialogue"), dialogue(attempt)]
          : el("p", {className: "empty"}, "No attempts recorded yet.")))));
  if (!dialog.open) dialog.showModal();
}

function draw() {
  const V = view(), out = V.out.length;
  // A scenario the cut takes leaves the table too; the line under it says which.
  document.getElementById("hint").textContent = (out ? `Cut ${CUTS[trim].toLowerCase()}: ${V.out.join(", ")}. ` : "") + compare;
  document.getElementById("tiles").replaceChildren(tiles());
  document.getElementById("charts").replaceChildren(
    categories("Tokens by category", V.spent, count, "The answer itself", "the tokens the agent reported for the answer, split by part", "The answers report no tokens."),
    categories("Time by category", V.time, secs, "Untracked time", "the part of an answer's time that no reported call covers: the agent's own code, waits, and any model work it does not report as a call", "The answers report no calls, so none of their time is tracked. Report the agent's steps to see where it goes."));
  document.getElementById("table").replaceChildren(table());
}

document.title = `${RUN.agent} · run ${RUN.short} · convy`;
document.getElementById("head").replaceChildren(header());
document.getElementById("filter").addEventListener("input", draw);
const compare = `Compare with another run: convy compare <run> ${RUN.short}`;
draw();
const opened = fromAddress();
if (opened) show(opened.id, opened.attempt);
</script>
</body>
</html>
