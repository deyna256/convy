<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run</title>
<link rel="icon" href="data:image/svg+xml,/*include icon.svg*/">
<style>
/*include base.css*/
/*include window.css*/
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
#calls table { min-width: 620px; }
#calls .cname { max-width: 32ch; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 8px; }
#calls .chev { flex: none; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; }
#calls [aria-expanded="true"] .chev { transform: rotate(45deg); }
@media (prefers-reduced-motion: reduce) { #calls .chev { transition: none; } }
#calls .places td { background: var(--side); padding: 6px 12px 12px 36px; cursor: default; }
#calls .places ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#calls .places li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 13px; }
#calls .places .open { color: var(--focus); font-size: 13px; padding: 3px 0; }
#calls .places .open:hover { text-decoration: underline; }
.tot { display: flex; align-items: center; gap: 8px; min-width: 180px; }
.tot .track { position: relative; flex: 1; height: 8px; border-radius: 4px; background: var(--side); }
.tot .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--muted); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.crow:first-of-type { border-top: 0; padding-top: 0; }
.crow .from { grid-column: 1; font-size: 12px; color: var(--muted); }
.crow .tally { grid-row: 1 / 3; grid-column: 2; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.tiles.four { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.tile .s.bad { color: var(--fail); }
.meter { display: flex; gap: 2px; height: 8px; margin: 8px 0 4px; }
.meter > span { min-width: 3px; border-radius: 2px; }
.meter .passing { background: var(--pass); } .meter .failing { background: var(--fail); } .meter .none { background: var(--none-bg); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; margin: 8px 0 4px; }
.pips span { width: 12px; height: 12px; border-radius: 3px; }
.pips .passing { background: var(--pass); } .pips .failing { background: var(--fail); } .pips .flaky { background: var(--flaky); } .pips .none { background: var(--none-bg); }
.endlist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--muted); }
.endlist li { display: inline-flex; align-items: center; gap: 5px; }
.endlist b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.endlist .key { margin: 0; }
.boxkey { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.boxkey .chart { padding: 0; background: none; width: 56px; }
.boxkey .track { display: block; }
.tile.range { gap: 6px; }
.since { font-size: 12.5px; } .since .delta { font-size: 12.5px; }
.big .since { margin-left: auto; }
.meta.changed { color: var(--flaky); margin-top: 4px; }
.lrow { display: flex; justify-content: space-between; gap: 12px; }
.big { display: flex; align-items: baseline; gap: 8px; }
.big .k { font-size: 12px; font-weight: 650; color: var(--muted); }
.tile.range .chart { padding: 0; background: none; }
.tile.range .track { display: block; }
.trio { display: flex; gap: 20px; margin: 0; font-size: 13px; }
.trio div { display: flex; gap: 6px; }
.trio dt { color: var(--muted); } .trio dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; }
.comp { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--rule); }
.comp .meter { height: 12px; margin-top: 0; }
.end.user_stop { background: var(--pass); } .end.max_turns { background: var(--flaky); } .end.agent_failure { background: var(--fail); }
.end.agent_busy { background: var(--none); } .end.model_failure { background: transparent; border: 1.5px solid var(--none); }
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <section id="tiles" aria-label="The run in numbers"></section>
  <div class="block"><div class="tools"><h2>Claims</h2></div>
    <section id="outcomes" class="charts" aria-label="Claims that failed"></section></div>
  <div class="tools" id="scenarios-head"><h2>Scenarios</h2><input type="search" id="filter" placeholder="Filter, e.g. refund-*" aria-label="Filter scenarios by id; * matches any text"></div>
  <div class="panel scroll" id="table"></div>
  <div class="block"><div class="tools"><h2>Time and tokens by scenario</h2>
    <span class="boxkey" aria-hidden="true"><span class="chart"><span class="track"><span class="whisker" style="left:0;width:100%"></span><span class="box" style="left:25%;width:45%"></span><span class="median" style="left:45%"></span></span></span>min to max · p10 to p90 · median</span></div>
    <section id="spread" class="charts" aria-label="Time and tokens by scenario"></section></div>
  <div class="block"><div class="tools"><h2>Tokens</h2></div>
    <section id="tokens" class="charts" aria-label="Tokens by turn and by part"></section></div>
  <section id="calls" aria-label="The agent's calls"></section>
  <p class="hint" id="hint"></p>
</div>
<dialog class="window" id="window" aria-labelledby="window-title"></dialog>
<script>
/*include window.js*/

// The run's page: its tiles, its charts, its scenarios, and the window of one scenario.
const DATA = __DATA__;
const RUN = DATA.run, M = DATA.metrics;

function header() {
  const status = STATUS[RUN.status];
  return el("div", {className: "top"},
    el("div", {},
      el("div", {className: "eyebrow"}, el("a", {href: "../../index.html"}, "CONVY"), ` / ${RUN.agent} / ${RUN.short}`),
      el("h1", {}, `Run ${when(RUN.started)}`),
      el("p", {className: "meta"}, [RUN.version && `version ${RUN.version}`, `${plural(RUN.scenarios, "scenario")} × ${plural(RUN.k, "attempt")}`, status, RUN.trust > 0 && `trust ${RUN.trust}`,
        RUN.unreadable && plural(RUN.unreadable, "unreadable line")].filter(Boolean).join(" · ")),
      B && B.differences.length > 0 && el("p", {className: "meta changed"}, `Changed since ${B.run.short}: ${B.differences.join(", ")}`)),
    el("div", {className: "controls"}, chooser, themeButton()));
}

// A tile's change since the agent's run before; nothing on its first run.
const B = DATA.before;
const since = (delta, unit) => B && (delta.tone === "same" && !delta.value
  ? el("span", {className: "since muted"}, `same as ${B.run.short}`)
  : el("span", {className: "since"}, change(delta, unit), el("span", {className: "muted"}, ` vs ${B.run.short}`)));

// The tiles: each a number and a small picture of what it is made of, words only where a picture
// cannot say it.
const SHORT = {user_stop: "user finished", max_turns: "out of turns", agent_failure: "agent failed", agent_busy: "agent busy", model_failure: "convy's model failed"};
function tiles() {
  const tile = (label, value, delta, ...rest) => el("div", {className: "tile"}, el("span", {className: "l"}, label), el("div", {className: "big"}, el("span", {className: "v"}, value), delta), rest);
  const bar = parts => el("div", {className: "meter", "aria-hidden": "true"}, parts.filter(([, n]) => n > 0).map(([cls, n, title]) => el("span", {className: cls, style: `flex: ${n}`, title})));
  const failed = M.judged - M.passed, open = M.attempts - M.judged;
  const errors = [[M.agent_errors, "agent failure"], [M.busy, "busy agent"], [M.model_errors, "model failure"]].filter(([n]) => n).map(([n, w]) => plural(n, w)).join(" · ");
  const total = DATA.ends.reduce((sum, [, n]) => sum + n, 0);
  return [
    el("div", {className: "tiles four"},
      tile("Pass rate", pct(M.rate), since(B?.deltas.rate, points),
        bar([["passing", M.passed, `${M.passed} passed`], ["failing", failed, `${failed} failed`], ["none", open, `${open} without a verdict`]]),
        el("span", {className: "s"}, `${M.passed} of ${plural(M.judged, "attempt")}${notTrusted(M.cut)}`)),
      tile("Stable scenarios", [String(M.stable), el("small", {}, `of ${RUN.scenarios}`)], since(B?.deltas.stable, String),
        el("div", {className: "pips", role: "img", "aria-label": DATA.scenarios.map(v => `${v.id}: ${SCENARIO[v.result]}`).join(", ")},
          DATA.scenarios.map(v => el("span", {className: v.result, title: `${v.id}: ${SCENARIO[v.result]}`}))),
        el("span", {className: "s"}, RUN.k > 1 ? "passed every attempt" : "one attempt each")),
      tile("Errors", String(M.errors), since(B?.deltas.errors, String), el("span", {className: M.errors ? "s bad" : "s"}, errors || "none")),
      total > 0 && el("div", {className: "tile"}, el("span", {className: "l"}, `How the ${plural(total, "dialogue")} ended`),
        el("div", {className: "meter ends", "aria-hidden": "true"}, DATA.ends.map(([end, n]) => el("span", {className: `end ${end}`, style: `flex: ${n}`, title: `${STOPS[end]}: ${n}`}))),
        el("ul", {className: "endlist"}, DATA.ends.map(([end, n]) => el("li", {}, el("i", {className: `key end ${end}`}), SHORT[end], el("b", {}, String(n))))))),
    el("div", {className: "tiles two"},
      rangeTile("Time per answer", M.seconds, secs, M.seconds ? plural(M.seconds.n, "answer") : "no answers", since(B?.deltas.seconds.p50, secs)),
      rangeTile("Tokens per attempt", M.tokens, count, M.tokens == null ? "not reported" : M.reported === M.attempts ? plural(M.attempts, "attempt") : `${M.reported} of ${M.attempts} report tokens`,
        since(B?.deltas.tokens.p50, count), M.parts && composition(M.parts))),
  ];
}

// A spread as a tile: its P50 large, its range drawn as the box plots below draw it, and the other
// statistics small.
function rangeTile(label, d, unit, note, delta, extra = null) {
  if (!d) return el("div", {className: "tile"}, el("span", {className: "l"}, label), el("span", {className: "v"}, "—"), el("span", {className: "s"}, note));
  const at = v => d.max ? v / d.max * 100 : 0;
  return el("div", {className: "tile range"},
    el("div", {className: "lrow"}, el("span", {className: "l"}, label), el("span", {className: "s"}, note)),
    el("div", {className: "big"}, el("span", {className: "v"}, unit(d.p50)), el("span", {className: "k"}, "P50"), delta),
    el("div", {className: "chart"}, el("span", {className: "track", "aria-hidden": "true", title: `min ${unit(d.min)} · p10 ${unit(d.p10)} · median ${unit(d.p50)} · p90 ${unit(d.p90)} · max ${unit(d.max)}`},
      el("span", {className: "whisker", style: `left: ${at(d.min)}%; width: ${at(d.max) - at(d.min)}%`}),
      el("span", {className: "box", style: `left: ${at(d.p10)}%; width: max(4px, ${at(d.p90) - at(d.p10)}%)`}),
      el("span", {className: "median", style: `left: ${at(d.p50)}%`}))),
    el("dl", {className: "trio"}, [["P90", d.p90], ["Max", d.max], ["Mean", d.mean]].map(([k, v]) => el("div", {}, el("dt", {}, k), el("dd", {}, unit(v))))),
    extra);
}

// The mean tokens per attempt as one bar of its parts, each part's number in the legend.
function composition(p) {
  const words = partWords(p);
  const shown = PARTS.filter(k => p[k]);
  return el("div", {className: "comp"},
    el("div", {className: "meter", "aria-hidden": "true"}, shown.map(k => el("span", {className: `seg ${SEG[k]}`, style: `flex: ${p[k]}`, title: `${count(p[k])} ${words[k]}`}))),
    el("ul", {className: "endlist"}, shown.map(k => el("li", {}, el("i", {className: `key ${SEG[k]}`}), words[k], el("b", {}, count(p[k])))),
      M.cached != null && el("li", {className: "muted"}, `${pct(M.cached)} of the input cached`, B && B.was.cached != null && ` · was ${pct(B.was.cached)}`)));
}

function table() {
  const {mask, keep} = filtered();
  const rows = DATA.scenarios.filter(s => keep(s.id)).map(s => {
    const open = el("button", {className: "open", type: "button", "aria-label": `Open ${s.id}`}, s.id);
    const row = el("tr", {className: "row"},
      el("td", {}, open), el("td", {}, badge(s.result)),
      el("td", {}, squares(attemptMarks(s.attempts), "Attempts", null, n => show(s.id, n))),
      el("td", {className: "n metric"}, secs(chosen(s.seconds)), el("small", {}, s.seconds == null ? "" : stat === "max" ? `p50 ${secs(s.seconds.p50)}` : `max ${secs(s.seconds.max)}`)),
      el("td", {className: "n metric", title: s.tokens == null ? null : tokenParts(s)}, count(chosen(s.tokens)), el("small", {}, s.tokens == null ? "not reported" : stat === "max" ? `p50 ${count(s.tokens.p50)}` : `max ${count(s.tokens.max)}`)));
    row.addEventListener("click", () => show(s.id, 1));
    return row;
  });
  return el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Scenario"), el("th", {}, "Result"), el("th", {}, "Attempts"), el("th", {className: "n"}, `Time per answer · ${STAT[stat]}`), el("th", {className: "n"}, `Tokens per attempt · ${STAT[stat]}`))),
    el("tbody", {}, rows.length ? rows : el("tr", {}, el("td", {className: "empty", colSpan: 5}, `No scenario matches ${mask}`))));
}

const dialog = document.getElementById("window");
dialog.addEventListener("close", clearAddress);

function show(id, number) {
  const s = DATA.scenarios.find(item => item.id === id);
  if (!s) return;
  const attempt = s.attempts.find(a => a.attempt === number) ?? s.attempts[0];
  address(id, attempt ? attempt.attempt : 1);
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"}, s.attempts.map(a => {
    const tab = el("button", {className: "tab", type: "button", role: "tab", "aria-selected": String(a === attempt)}, icon(kind(a.passed)), `Attempt ${a.attempt}`);
    tab.addEventListener("click", () => { show(id, a.attempt); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); });
    return tab;
  }));
  dialog.replaceChildren(el("div", {className: "frame"},
    el("div", {className: "whead"}, el("h2", {id: "window-title"}, s.id), badge(s.result),
      el("span", {className: "muted"}, `run ${RUN.short} · ${when(RUN.started)} · at most ${plural(s.max_turns, "turn")}`), close),
    el("div", {className: "wbody"},
      el("div", {className: "side"},
        el("div", {className: "sec"}, "The user was told"), el("p", {className: "told"}, s.user),
        el("div", {className: "sec"}, `Claims · ${plural(s.attempts.length, "attempt")}`),
        el("ol", {className: "claims"}, s.claims.map((c, i) => el("li", {}, el("span", {className: "no"}, String(i + 1)), icon(c.result), el("span", {}, c.text),
          el("span", {className: "tally"}, squares(claimMarks(s.attempts, i), "Decisions", attempt && attempt.attempt, n => { show(id, n); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); }), claimTally(c)))))),
      el("div", {className: "main"},
        attempt ? [tabs, attemptTiles(attempt), el("div", {className: "sec"}, "The judge"), judgeLines(attempt, RUN), el("div", {className: "sec"}, "The dialogue"), dialogue(attempt)]
          : el("p", {className: "empty"}, "No attempts recorded yet.")))));
  if (!dialog.open) dialog.showModal();
}

// The claims that failed in some trusted decision, the least held first: each with its scenario and
// its decisions per attempt; the rest as a count. None at all with a verdict: no panel.
function failedClaims() {
  const {failed, held, undecided} = DATA.claims;
  if (!failed.length && !held) return null;
  const total = failed.length + held + undecided;
  const rest = [held && `${plural(held, "claim")} held in every attempt`, undecided && `${undecided} not decided`].filter(Boolean).join(" · ");
  if (!failed.length) return el("section", {className: "chart", "aria-label": "Claims"}, el("h3", {}, "Claims"), el("p", {className: "caption"}, rest));
  const rows = failed.map(f => {
    const s = DATA.scenarios.find(item => item.id === f.scenario);
    const open = el("button", {className: "open mono", type: "button", "aria-label": `Open ${s.id}`}, s.id);
    open.addEventListener("click", () => show(s.id, 1));
    return el("div", {className: "crow"}, el("span", {}, s.claims[f.claim].text),
      el("span", {className: "from"}, open),
      el("span", {className: "tally"}, squares(claimMarks(s.attempts, f.claim), "Decisions", null, n => show(s.id, n)), `${f.held} of ${f.judged}`));
  });
  return chart(`Failed · ${failed.length} of ${total}`, rows, rest && el("p", {className: "caption"}, rest), draw);
}

// The box plot: per scenario whiskers from its least to its largest value, a box from p10 to p90,
// a line at the median, and the median and n as text; one value is a single tick. The order and
// every number come from the data.
function boxes(title, order, field, unit, what, missing) {
  const {keep} = filtered();
  const views = order.filter(keep).map(id => DATA.scenarios.find(s => s.id === id));
  const top = Math.max(0, ...views.map(s => s[field] ? s[field].max : 0));
  const at = v => top ? v / top * 100 : 0;
  const rows = views.map(s => {
    const name = el("span", {className: "rid mono", title: s.id}, s.id), d = s[field];
    if (d == null) return el("div", {className: "rrow"}, name, el("span", {className: "muted"}, missing(s)), el("span"));
    const marks = d.n === 1 ? el("span", {className: "tick", style: `left: ${at(d.p50)}%`}) : [
      el("span", {className: "whisker", style: `left: ${at(d.min)}%; width: ${at(d.max) - at(d.min)}%`}),
      el("span", {className: "box", style: `left: min(${at(d.p10)}%, 100% - 4px); width: max(4px, ${at(d.p90) - at(d.p10)}%)`}),
      el("span", {className: "median", style: `left: ${at(d.p50)}%`})];
    return el("div", {className: "rrow", title: `${s.id}: min ${unit(d.min)} · p10 ${unit(d.p10)} · median ${unit(d.p50)} · p90 ${unit(d.p90)} · max ${unit(d.max)} · ${plural(d.n, what)}`}, name,
      el("span", {className: "track", "aria-hidden": "true"}, marks),
      el("span", {className: "n"}, unit(d.p50)));
  });
  const lead = views.find(s => s[field]);
  return lede(chart(title, rows, scaleLine(unit(top)), draw), lead && `${field === "seconds" ? "Slowest" : "Most"}: ${lead.id}, ${unit(lead[field].p50)} at the median`);
}

// Tokens by part, per scenario, the most first.
function parts() {
  const {keep} = filtered();
  const views = DATA.by_parts.filter(keep).map(id => DATA.scenarios.find(s => s.id === id));
  const top = Math.max(0, ...views.map(s => s.tokens.mean));
  const rows = views.map(s => el("div", {className: "rrow", title: `${s.id}: ${count(s.tokens.mean)} per attempt · ${partText(s.parts)}`},
    el("span", {className: "rid mono", title: s.id}, s.id),
    el("span", {className: "ptrack", "aria-hidden": "true"}, partBar(s.parts, s.tokens.mean, top)),
    el("span", {className: "n"}, count(s.tokens.mean))));
  const section = lede(chart("Tokens per attempt by part · mean", rows, scaleLine(count(top)), draw),
    views.length > 0 && `Most per attempt: ${views[0].id}, ${count(views[0].tokens.mean)}`);
  (section.querySelector(".lede") ?? section.querySelector("h3")).after(partLegend(views.map(s => s.parts)));  // the key above the bars, in their order
  return section;
}

// The agent's calls by name: how many, their total time as a bar on a scale from 0 to the largest
// total, and the chosen statistic of the seconds and tokens per call. A name opens to its slowest
// calls, each a way to the answer that made it.
const PLACES = 5;
const unfolded = new Set();  // the names opened; `every` keeps those showing all their calls
function calls() {
  if (!DATA.calls.length) return [];
  const top = Math.max(...DATA.calls.map(c => c.total));
  const rows = DATA.calls.flatMap(c => {
    const open = unfolded.has(c.name);
    const name = el("button", {className: "open cname", type: "button", "aria-expanded": String(open), title: c.name}, el("span", {className: "chev", "aria-hidden": "true"}), c.name);
    const row = el("tr", {className: "row"},
      el("td", {}, name),
      el("td", {className: "n"}, String(c.calls)),
      el("td", {}, el("span", {className: "tot"}, el("span", {className: "track", "aria-hidden": "true"}, el("span", {className: "fill", style: `width: max(3px, ${top ? c.total / top * 100 : 0}%)`})), el("span", {className: "n"}, secs(c.total)))),
      el("td", {className: "n"}, secs(chosen(c.seconds))),
      el("td", {className: "n"}, count(chosen(c.tokens))));
    row.addEventListener("click", () => {
      open ? unfolded.delete(c.name) : unfolded.add(c.name);
      draw();
      document.querySelector(`#calls .cname[title="${CSS.escape(c.name)}"]`).focus();  // the redrawn button keeps the focus
    });
    if (!open) return [row];
    const key = `call ${c.name}`, all = every.has(key), shown = c.places.slice(0, all ? c.places.length : PLACES);
    const more = c.places.length > PLACES && el("button", {className: "more", type: "button"}, all ? "Show fewer" : `Show all ${c.places.length}`);
    if (more) more.addEventListener("click", () => { all ? every.delete(key) : every.add(key); draw(); });
    return [row, el("tr", {className: "places"}, el("td", {colSpan: 5},
      el("ol", {}, shown.map(p => {
        const go = el("button", {className: "open", type: "button"}, `${p.scenario} · attempt ${p.attempt} · turn ${p.turn + 1}`);
        go.addEventListener("click", () => { show(p.scenario, p.attempt); reveal(p.turn, p.step); });
        return el("li", {}, go, el("span", {className: "muted"}, `${secs(p.seconds)}${p.tokens == null ? "" : ` · ${count(p.tokens)} tokens`}`));
      })), more))];
  });
  const lead = DATA.calls[0];
  return [el("div", {className: "tools"}, el("h2", {}, "The agent's calls")),
    el("p", {className: "lede"}, `Most time: ${lead.name}, ${secs(lead.total)} over ${plural(lead.calls, "call")}`),
    el("div", {className: "panel scroll"}, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Call"), el("th", {className: "n"}, "Calls"), el("th", {}, "Total time"),
        el("th", {className: "n"}, `Seconds per call · ${STAT[stat]}`), el("th", {className: "n"}, `Tokens per call · ${STAT[stat]}`))),
      el("tbody", {}, rows))),
    el("p", {className: "hint"}, "Open a call to see its slowest runs and go to the answer that made each one.")];
}

function draw() {
  document.getElementById("outcomes").replaceChildren(...[failedClaims()].filter(Boolean));
  document.getElementById("spread").replaceChildren(
    boxes("Time per answer by scenario", DATA.by_seconds.p50, "seconds", secs, "answer", s => s.attempts.length ? "no answers" : "not played"),
    boxes("Tokens per attempt by scenario", DATA.by_tokens.p50, "tokens", count, "attempt", s => s.attempts.length ? "not reported" : "not played"));
  const byTurn = DATA.turns.length > 1;
  document.getElementById("tokens").replaceChildren(...[
    byTurn && turnChart(`Tokens by turn · ${STAT[stat]} per answer`, DATA.turns, turnTop(DATA.turns)),
    DATA.by_parts.length > 0 && parts()].filter(Boolean));
  document.getElementById("calls").replaceChildren(...calls());
  document.getElementById("table").replaceChildren(table());
}

const chooser = statSwitch(draw);
document.title = `${RUN.agent} · run ${RUN.short} · convy`;
document.getElementById("head").replaceChildren(header());
document.getElementById("tiles").replaceChildren(...tiles());
document.getElementById("filter").addEventListener("input", draw);
document.getElementById("hint").textContent = B ? `Compare with the run before: convy compare ${B.run.short} ${RUN.short}` : `Compare with another run: convy compare <run> ${RUN.short}`;
draw();
const opened = fromAddress();
if (opened) show(opened.id, opened.attempt);
</script>
</body>
