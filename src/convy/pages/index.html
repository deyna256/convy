<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · convy</title>
<style>
/*include base.css*/
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <div class="panel scroll" id="table"></div>
  <p class="hint" id="hint"></p>
</div>
<script>
// The index: every run, newest first, with a link to its report.
const DATA = __DATA__;

function header() {
  return el("div", {className: "top"},
    el("div", {}, el("div", {className: "eyebrow"}, "CONVY"), el("h1", {}, "Runs"),
      el("p", {className: "meta"}, DATA.runs.length ? plural(DATA.runs.length, "run") : "No runs yet. Run convy run <agent> and they appear here.")),
    themeButton());
}

function table() {
  if (!DATA.runs.length) return el("p", {className: "empty"}, "Nothing to list.");
  return el("table", {},
    el("thead", {}, el("tr", {}, ["Agent", "Started", "Run", "Version", "Status", "Pass rate", ""].map(t => el("th", {}, t)))),
    el("tbody", {}, DATA.runs.map(row => {
      const run = row.run;
      return el("tr", {},
        el("td", {className: "mono"}, run.agent),
        el("td", {}, when(run.started)),
        el("td", {className: "mono"}, run.short),
        el("td", {className: "muted"}, run.version || "—"),
        el("td", {className: "muted"}, STATUS[run.status] ?? "finished"),
        el("td", {className: "n"}, el("strong", {}, pct(row.rate)), el("span", {className: "muted"}, ` · ${row.passed} of ${row.judged}`)),
        el("td", {}, el("a", {href: row.report}, "report")));
    })));
}

document.getElementById("head").replaceChildren(header());
document.getElementById("table").replaceChildren(table());
document.getElementById("hint").textContent = "Compare two runs: convy compare <before> <after>";
</script>
</body>
</html>
