<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · convy</title>
<link rel="icon" href="data:image/svg+xml,/*include icon.svg*/">
<style>
/*include base.css*/
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
.group { margin-top: 14px; overflow: hidden; }
.ghead { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.ghead h2 { margin: 0; font: 650 15px/1.3 var(--mono); overflow-wrap: anywhere; }
.sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 400; }
.runs { min-width: 0; overflow-x: auto; }
.strip { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
.strip .bar { flex: none; width: 10px; height: 30px; display: flex; align-items: flex-end; border-radius: 2px; background: var(--side); }
.strip .bar.now { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.strip .fill { width: 100%; border-radius: 2px; }
.fill.passing, .key.passing { background: var(--pass); } .fill.flaky, .key.flaky { background: var(--flaky); }
.fill.failing, .key.failing { background: var(--fail); } .fill.none, .key.none { background: var(--none); }
.fill.unfinished { background: transparent; border: 1.5px solid var(--muted); min-height: 6px; }
.strip .brk { flex: none; width: 2px; height: 30px; margin: 0 3px; border-radius: 1px; background: var(--muted); }
.key.line { width: 2px; background: var(--muted); }
.trend { display: grid; grid-template-columns: 22ch 7ch max-content; align-items: end; gap: 0 8px; margin-top: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.trend.first { margin-top: 0; }
.trend .tl { display: contents; }
.trend .tv { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.strip.thin, .strip.thin .bar, .strip.thin .brk { height: 18px; }
.strip.thin .bar { background: none; }
.strip.thin .fill.unfinished { min-height: 0; background: transparent; }
.fill.value { background: var(--muted); } .fill.cache { background: var(--cache); } .fill.stub { background: var(--rule); }
.group th { white-space: normal; }
.group td { white-space: nowrap; }
.group td.setup { white-space: nowrap; }
@media (max-width: 1100px) { .group td.setup { white-space: normal; overflow-wrap: anywhere; min-width: 11ch; } }
.group th, .group td { padding-left: 9px; padding-right: 9px; }
td.changed { color: var(--focus); } td.changed::before { content: "● "; font-size: 9px; vertical-align: 2px; }
.group tbody tr:last-child td { border-bottom: 0; }
.group .more { display: block; margin: 0; padding: 10px 16px; border-top: 1px solid var(--rule); }
.cmp { position: sticky; bottom: 12px; margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--side); border: 1px solid var(--focus); border-radius: 10px; }
.cmp:empty { display: none; }
.cmp code { font-family: var(--mono); background: var(--surface); padding: 3px 8px; border-radius: 6px; overflow-wrap: anywhere; }
@media (max-width: 700px) {
  .ghead { grid-template-columns: 1fr; }
  /* the labels and the legend stay in view as the bars scroll */
  .runs > div { width: max-content; min-width: 100%; }
  .trend { grid-template-columns: max-content; gap: 2px; }
  .trend .tl { display: flex; gap: 8px; position: sticky; left: 0; justify-self: start; }
  .runs .legend { position: sticky; left: 0; max-width: calc(100vw - 66px); }
}
</style>
<script>
/*include base.js*/
</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <div id="switch"></div>
  <div id="groups"></div>
  <div class="cmp" id="compare" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
</div>
<script>
// The index: runs grouped by agent, newest first, with a strip of each agent's runs.
const DATA = __DATA__;
const RUNS = 5, BARS = 40;
const RESULT = {passing: "all passed", flaky: "some", failing: "none", none: "no verdict"};
const opened = new Set();  // agents whose older runs show
let picked = [];  // the runs ticked to compare, in the order ticked

function header() {
  const total = DATA.agents.reduce((sum, group) => sum + group.rows.length, 0);
  return el("div", {className: "top"},
    el("div", {}, el("div", {className: "eyebrow"}, "CONVY"), el("h1", {}, "Runs"),
      el("p", {className: "meta"}, total ? `${plural(total, "run")} · ${plural(DATA.agents.length, "agent")}` : "No runs yet. Run convy run <agent> and they appear here.")),
    themeButton());
}

// The agent's runs, newest left: a bar per run as high as its pass rate, coloured by its result,
// and a line where the setup changed; under them the same runs' time, tokens and cache share, each
// on its own scale from 0, the newest run's number beside it. The table under it holds the same facts.
function strip(group) {
  const rows = group.rows.slice(0, BARS);
  const lined = bars => bars.flatMap((bar, i) => i && rows[i - 1].changed.length ? [el("span", {className: "brk"}), bar] : [bar]);
  const passes = rows.map((row, i) => {
    const m = row.metrics, rate = m.rate;
    return el("span", {className: i ? "bar" : "bar now", title: `${row.run.short} · ${when(row.run.started)} · ${m.judged ? `${m.passed} of ${m.judged}` : "no verdict"}${STATUS[row.run.status] ? ` · ${STATUS[row.run.status]}` : ""}`},
      el("span", {className: `fill ${row.result}${row.run.status === "finished" ? "" : " unfinished"}`, style: `height: ${rate == null ? 3 : Math.max(3, rate * 30)}px`}));
  });
  const trend = (label, values, unit, fill) => {
    const top = Math.max(0, ...values.filter(v => v != null));
    return el("div", {className: "trend"}, el("span", {className: "tl"}, el("span", {}, label), el("span", {className: "tv"}, unit(values[0]))),
      el("div", {className: "strip thin"}, lined(rows.map((row, i) => el("span", {className: "bar", title: `${row.run.short} · ${when(row.run.started)} · ${label}: ${values[i] == null ? "not reported" : unit(values[i])}`},
        el("span", {className: values[i] == null ? "fill stub" : `fill ${fill}${row.run.status === "finished" ? "" : " unfinished"}`, style: `height: ${values[i] == null || !top ? 2 : Math.max(2, values[i] / top * 18)}px`}))))));
  };
  const shown = group.rows.length > BARS ? el("span", {}, `newest ${BARS} of ${group.rows.length}`) : null;
  const reported = rows.filter(row => row.metrics.cached != null).length;
  const legend = el("div", {className: "legend"}, Object.entries(RESULT).map(([result, word]) => el("span", {}, el("i", {className: `key ${result}`}), word)),
    el("span", {}, el("i", {className: "key line"}), "setup changed"), shown);
  return el("div", {className: "runs", tabindex: "-1"}, el("div", {"aria-hidden": "true"},
    el("div", {className: "trend first"}, el("span", {className: "tl"}, el("span", {}, "Pass rate"), el("span", {className: "tv"}, pct(rows[0].metrics.rate))), el("div", {className: "strip"}, lined(passes))),
    trend(`Time / answer · ${STAT[stat]}`, rows.map(row => chosen(row.metrics.seconds)), secs, "value"),
    trend(`Tokens / attempt · ${STAT[stat]}`, rows.map(row => chosen(row.metrics.tokens)), count, "value"),
    trend("From the cache", rows.map(row => row.metrics.cached), pct, "cache"),
    legend),
    el("span", {className: "sr-only"}, `From the cache: ${pct(rows[0].metrics.cached)} in the newest run; ${reported} of ${plural(rows.length, "run")} report it`));
}

// A setup cell: marked when it differs from the agent's previous run, which the next row holds.
const setupOf = (row, field) => field === "trust" && !row.run.trust ? "—" : String(row.run[field]);
function cell(row, older, field, text) {
  const base = ["user", "judge", "convy"].includes(field) ? "mono setup" : "mono";
  if (!row.changed.includes(field)) return el("td", {className: base}, text);
  const was = field === "scenarios" ? [row.added && `+${row.added}`, row.dropped && `−${row.dropped}`].filter(Boolean).join(" ") + " scenarios" : `was ${setupOf(older, field)}`;
  return el("td", {className: `${base} changed`, title: was}, text);
}

function line(group, row, older) {
  const run = row.run, m = row.metrics, state = STATUS[run.status];
  const box = el("input", {type: "checkbox", checked: picked.includes(row), "aria-label": `Compare run ${run.short}`, "data-id": run.id});
  box.addEventListener("change", () => pick(row, box.checked, run.id));
  return el("tr", {},
    el("td", {}, box),
    el("td", {}, el("a", {className: "mono", href: row.report}, el("strong", {}, run.short)), el("span", {className: "sub"}, when(run.started), state && ` · ${state}`)),
    el("td", {className: "mono"}, run.version || "—"),
    cell(row, older, "scenarios", `${run.scenarios} × ${run.k}`),
    cell(row, older, "user", run.user), cell(row, older, "judge", run.judge), cell(row, older, "convy", run.convy),
    group.trusted && cell(row, older, "trust", setupOf(row, "trust")),
    el("td", {className: "n"}, el("strong", {}, pct(m.rate)), el("span", {className: "sub"}, `${m.passed} of ${m.judged}${notTrusted(m.cut)}`)),
    el("td", {className: "n"}, secs(chosen(m.seconds))), el("td", {className: "n"}, count(chosen(m.tokens))), el("td", {className: "n"}, String(m.errors)));
}

function section(group) {
  const all = opened.has(group.agent), older = group.rows.length - RUNS;
  const rows = all ? group.rows : group.rows.slice(0, RUNS);
  const more = older > 0 && el("button", {className: "more", type: "button"}, all ? "Show fewer runs" : `Show ${plural(older, "older run")}`);
  if (more) more.addEventListener("click", () => { all ? opened.delete(group.agent) : opened.add(group.agent); draw(() => document.querySelector(`section[aria-label="${CSS.escape(group.agent)}"] .more`)); });
  const heads = [  // the last four hold numbers
    "", "Run", "Version", "Scenarios × attempts", "User", "Judge", "convy", group.trusted && "Trust", "Pass rate", `Time / answer · ${STAT[stat]}`, `Tokens / attempt · ${STAT[stat]}`, "Errors"].filter(h => h !== false);
  return el("section", {className: "panel group", "aria-label": group.agent},
    el("div", {className: "ghead"}, el("div", {}, el("h2", {}, group.agent), el("span", {className: "sub"}, `${plural(group.rows.length, "run")} · last ${when(group.rows[0].run.started)}`)), strip(group)),
    el("div", {className: "scroll"}, el("table", {},
      el("thead", {}, el("tr", {}, heads.map((h, i) => el("th", {className: i >= heads.length - 4 ? "n" : null, "aria-label": h || "Compare"}, h)))),
      el("tbody", {}, rows.map((row, i) => line(group, row, group.rows[i + 1]))))),
    more);
}

// Two ticked runs give the command that compares them, the older first; a third replaces the first.
function pick(row, on, id) {
  picked = picked.filter(r => r !== row);
  if (on) picked.push(row);
  if (picked.length > 2) picked.shift();
  draw(() => document.querySelector(`input[data-id="${CSS.escape(id)}"]`));
}
function compareBar() {
  const bar = document.getElementById("compare");
  if (picked.length < 2) return bar.replaceChildren();
  const [older, newer] = [...picked].sort((a, b) => b.order - a.order);
  const command = `convy compare ${older.run.id} ${newer.run.id}`;
  const code = el("code", {}, command);
  const copy = el("button", {className: "theme", type: "button"}, "Copy");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(command); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 2000); }
    catch { getSelection().selectAllChildren(code); copy.textContent = "Select and copy"; setTimeout(() => { copy.textContent = "Copy"; }, 2000); }  // no clipboard here: the command is selected to copy by hand
  });
  bar.replaceChildren(el("span", {}, "Compare them:"), code, copy);
}

// Redraws everything, then puts back the sideways scroll and the focus (find() gives the element to focus).
function draw(find) {
  const groups = document.getElementById("groups");
  const left = [...groups.querySelectorAll(".scroll")].map(div => div.scrollLeft);
  groups.replaceChildren(...(DATA.agents.length ? DATA.agents.map(section) : [el("p", {className: "empty"}, "Nothing to list.")]));
  groups.querySelectorAll(".scroll").forEach((div, i) => { div.scrollLeft = left[i] || 0; });
  compareBar();
  if (find) find()?.focus();
}

document.getElementById("head").replaceChildren(header());
document.getElementById("switch").replaceChildren(statSwitch(draw));
document.getElementById("hint").textContent = "Tick two runs to compare them, or run: convy compare <before> <after>";
draw();
</script>
</body>
</html>
