<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · convy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318212f'/><circle cx='50' cy='50' r='28' fill='none' stroke='%23eef1f5' stroke-width='17'/><circle cx='50' cy='50' r='10' fill='%235fc48a'/></svg>">
<style>
:root {
  --page: #eef1f5; --surface: #ffffff; --side: #f4f6f9; --ink: #18212f; --muted: #4a5464;
  --rule: #d5dbe3; --user: #eef1f5; --focus: #2c4a74; --thought: #7a4fc4;
  --cache: #5d85ce; --input: #3a4aa7; --output: #bc7c40; --thinking: #8d58b7;
  --pass: #1a6b43; --pass-bg: #e3f2ea; --fail: #b3261e; --fail-bg: #f8e3e1;
  --flaky: #8a5100; --flaky-bg: #f6ecd9; --none: #4a5464; --none-bg: #e2e7ee; --on-status: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Noto Sans", "Adwaita Sans", Cantarell, "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15181e; --surface: #171a21; --side: #1d212a; --ink: #e4e7ec; --muted: #a3abb8;
    --rule: #2e3440; --user: #232833; --focus: #9db4ff; --thought: #b69cf5;
    --cache: #7892d9; --input: #5061b3; --output: #b67f46; --thinking: #9970c4;
    --pass: #5fc48a; --pass-bg: #16301f; --fail: #ef7b70; --fail-bg: #3a1d1b;
    --flaky: #e0b155; --flaky-bg: #352a14; --none: #a3abb8; --none-bg: #262c36; --on-status: #171a21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #15181e; --surface: #171a21; --side: #1d212a; --ink: #e4e7ec; --muted: #a3abb8;
  --rule: #2e3440; --user: #232833; --focus: #9db4ff; --thought: #b69cf5;
  --cache: #7892d9; --input: #5061b3; --output: #b67f46; --thinking: #9970c4;
  --pass: #5fc48a; --pass-bg: #16301f; --fail: #ef7b70; --fail-bg: #3a1d1b;
  --flaky: #e0b155; --flaky-bg: #352a14; --none: #a3abb8; --none-bg: #262c36; --on-status: #171a21;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); }
.page { max-width: 1680px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 40px) 48px; }
.mono { font-family: var(--mono); }
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
.muted { color: var(--muted); }
.top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; margin-bottom: 18px; }
.top > div:first-child { flex: 1 1 320px; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
.eyebrow a { color: inherit; }
h1 { font-size: 22px; line-height: 1.25; margin: 8px 0 4px; font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.theme { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }

/* status icon, badge */
.si { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--on-status); font: 800 11px/1 var(--sans); flex: none; }
/* a status's colour, wherever a mark carries one: an icon, a square, a key, a bar */
:is(.si, .sq, .key, .fill, .meter > span).passing { background: var(--pass); }
:is(.si, .sq, .key, .fill, .meter > span).failing { background: var(--fail); }
:is(.si, .sq, .key, .fill, .meter > span).flaky { background: var(--flaky); }
:is(.si, .sq, .key, .fill, .meter > span).none { background: var(--none); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.badge.passing { background: var(--pass-bg); color: var(--pass); } .badge.failing { background: var(--fail-bg); color: var(--fail); }
.badge.flaky { background: var(--flaky-bg); color: var(--flaky); } .badge.none { background: var(--none-bg); color: var(--none); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile .l { font-size: 12.5px; color: var(--muted); }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.tile .v small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.tile .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* table */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 32px 0 10px; }
.tools h2 { font-size: 16px; font-weight: 650; margin: 0 auto 0 0; }
input[type=search] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 220px; max-width: 100%; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--side); }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric { font-size: 15px; font-weight: 650; }
.metric small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.open { all: unset; cursor: pointer; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
.open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.empty { color: var(--muted); padding: 24px 12px; }

/* attempt squares */
.squares { display: inline-flex; flex-wrap: wrap; gap: 3px; max-width: 207px; vertical-align: middle; }
.sq { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font: 800 10px/1 var(--sans); color: var(--on-status); }
.sq.go { cursor: pointer; } .sq.at { outline: 2px solid var(--ink); outline-offset: 1px; }

/* the spread and change blocks */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin-top: 14px; }
.chart { background: var(--surface); padding: 14px 16px; min-width: 0; }
.chart .empty { margin: 0; padding: 4px 0; font-size: 13px; }
.chart h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.chart .scale { display: grid; grid-template-columns: minmax(0, 16ch) minmax(0, 1fr) var(--tail, 8ch); gap: 4px 12px; align-items: center; }
.chart .caption { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }
.chart .scale { font-size: 13px; color: var(--muted); margin-top: 4px; }
.chart .scale > span { font-size: 11px; }
.chart .scale > span:nth-child(2):not(.ticks) { display: flex; justify-content: space-between; }
.chart .scale .ticks { display: block; position: relative; height: 1.3em; }
.chart .scale .ticks > span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart .scale .ticks > span:first-child { transform: none; } .chart .scale .ticks > span:last-child:not(:first-child) { transform: translateX(-100%); }
.chart.grid .ptrack { background-image: linear-gradient(to right, color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px); background-size: var(--grid) 100%; }
.more { all: unset; display: inline-block; cursor: pointer; color: var(--focus); font-size: 12.5px; margin-top: 8px; }
.more:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
@media (max-width: 760px) {
  .charts { grid-template-columns: minmax(0, 1fr); }
  .chart .scale { grid-template-columns: minmax(0, 1fr) var(--tail, 8ch); }
  .chart .scale > span:first-child { display: none; }
}

/* a lone panel takes the whole row */
.charts:has(> .chart:only-child) { grid-template-columns: minmax(0, 1fr); }

/* the statistic switch */
.switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 18px 0 0; font-size: 13px; color: var(--muted); }
.switch [role=group] { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface); }
.switch button { all: unset; cursor: pointer; padding: 4px 12px; color: var(--ink); }
.switch button + button { border-left: 1px solid var(--rule); }
.switch button[aria-pressed="true"] { background: var(--focus); color: var(--surface); font-weight: 650; }
.switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* the key of a colour */
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* tokens by turn and by part: parts apart by a 2px gap of the panel's surface */
.charts:empty { display: none; }
.seg { flex: 1 1 0; min-width: 0; min-height: 0; border-radius: 2px; }
.seg.cache, .key.cache { background: var(--cache); } .seg.input, .key.input { background: var(--input); }
.seg.output, .key.output { background: var(--output); } .seg.thinking, .key.thinking { background: var(--thinking); }
.chart .ptrack { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-height: 16px; }

/* a change from before */
.delta { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--pass); } .delta.bad { color: var(--fail); } .delta.same, .delta.noise, .delta.none { color: var(--muted); }

/* a panel's message, the page's controls */
.lede { margin: -4px 0 10px; font-size: 14px; font-weight: 550; color: var(--ink); }
.controls { flex: 0 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; }
.controls .switch { margin: 0; }

/* the tooltip, and the parts of a bar fading beside the one pointed at */
.tip { position: fixed; z-index: 10; max-width: 340px; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 14px rgb(0 0 0 / .25); font-variant-numeric: tabular-nums; }
[data-tip] { cursor: default; }
.pbar:hover > .seg, .meter:hover > span, .bars:hover .seg { opacity: .35; transition: opacity .12s; }
.pbar:hover > .seg:hover, .meter:hover > span:hover, .bars:hover .seg:hover { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .pbar .seg, .meter > span, .bars .seg { transition: none; } }

.group { margin-top: 14px; overflow: hidden; }
.ghead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.ghead > div:first-child { min-width: 0; }
.ghead h2 { margin: 0; font: 650 15px/1.3 var(--mono); overflow-wrap: anywhere; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.setup { font-family: var(--mono); overflow-wrap: anywhere; margin-top: 2px; }
.strip { display: flex; align-items: flex-end; gap: 3px; height: 40px; max-width: 100%; overflow-x: auto; }
.strip .bar { flex: none; width: 12px; height: 40px; display: flex; align-items: flex-end; border-radius: 2px; background: var(--side); }
.strip .fill { width: 100%; border-radius: 2px; }
.strip .fill.unfinished { background: transparent; border: 1.5px solid var(--muted); min-height: 6px; }
.strip .brk { flex: none; width: 2px; height: 40px; margin: 0 3px; border-radius: 1px; background: var(--muted); }
.group th, .group td { padding: 9px 12px; white-space: nowrap; }
.group th:first-child, .group td:first-child { padding-left: 16px; padding-right: 4px; }
.group .rest { width: 100%; }  /* the columns keep to the left */
.group tbody tr:last-child td { border-bottom: 0; }
.group tr.change td { padding-top: 0; color: var(--focus); font-size: 12.5px; font-family: var(--mono); white-space: normal; overflow-wrap: anywhere; }
.group tr:has(+ tr.change) td { border-bottom: 0; }
.rate strong { display: inline-block; min-width: 4.5ch; text-align: right; font-size: 15px; }
.rate .muted { margin-left: 8px; font-size: 12.5px; }
.errors { color: var(--fail); }
.group .more { display: block; box-sizing: border-box; width: 100%; margin: 0; padding: 10px 16px; border-top: 1px solid var(--rule); }
.cmp { position: sticky; bottom: 12px; margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--side); border: 1px solid var(--focus); border-radius: 10px; }
.cmp:empty { display: none; }
.cmp code { font-family: var(--mono); background: var(--surface); padding: 3px 8px; border-radius: 6px; overflow-wrap: anywhere; }
</style>
<script>
// Every number and decision comes from the data; this script only draws it.
// Everything from the data is added as text, never as HTML.

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key.startsWith("aria-") || key.startsWith("data-") || key === "role" || key === "style") node.setAttribute(key, value);
    else node[key] = value;
  }
  node.append(...children.flat(Infinity).filter(child => child != null && child !== false && child !== ""));
  return node;
}

// The theme: Auto follows the system; the choice is kept where the browser allows it.
const THEMES = ["auto", "light", "dark"];
const NAMES = {auto: "Auto", light: "Light", dark: "Dark"};
function storedTheme() {
  try { return THEMES.includes(localStorage.getItem("convy-theme")) ? localStorage.getItem("convy-theme") : "auto"; }
  catch { return "auto"; }
}
let theme = storedTheme();
function applyTheme(button) {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  if (button) {
    button.textContent = `Theme: ${NAMES[theme]}`;
    button.setAttribute("aria-label", `Theme: ${NAMES[theme]}. Switch theme`);
  }
}
function themeButton() {
  const button = el("button", {className: "theme", type: "button"});
  button.addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem("convy-theme", theme); } catch { /* not kept: the next page opens in Auto */ }
    applyTheme(button);
  });
  applyTheme(button);
  return button;
}
applyTheme(null);

const SCENARIO = {passing: "Passing", failing: "Failing", flaky: "Flaky", none: "No verdict"};
const ATTEMPT = {passing: "Passed", failing: "Failed", none: "No verdict"};
const GLYPH = {passing: "✓", failing: "✕", flaky: "◐", none: "–"};

const kind = passed => passed == null ? "none" : passed ? "passing" : "failing";
const icon = result => el("span", {className: `si ${result}`, "aria-hidden": "true"}, GLYPH[result]);
const badge = (result, words = SCENARIO) => el("span", {className: `badge ${result}`}, icon(result), words[result]);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const pct = rate => rate == null ? "—" : `${Math.round(rate * 100)}%`;
const notTrusted = cut => cut ? ` · ${cut} not trusted` : "";
const secs = s => s == null ? "—" : s > 0 && s < 0.1 ? `${Math.round(s * 1000)} ms` : s < 10 ? `${s.toFixed(1)} s` : `${Math.round(s)} s`;
const count = n => n == null ? "—" : n < 1000 ? String(Math.round(n)) : n < 1e6 ? `${(n / 1e3).toFixed(n < 1e4 ? 1 : 0)}k` : `${(n / 1e6).toFixed(1)}M`;
const when = iso => new Date(iso).toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"});
const STATUS = {running: "not finished", interrupted: "interrupted", finished: null};

// Squares, one per attempt: ✓, ✕ or – with its word in the title, the open attempt outlined, a
// click opening one. Not tab stops: the row's Open button and the window's tabs are the keyboard's.
function squares(marks, what, open, go) {
  return el("span", {className: "squares", role: "img", "aria-label": `${what}: ${marks.map(m => m.word).join(", ")}`},
    marks.map(m => {
      const square = el("span", {className: `sq ${m.result}${m.attempt === open ? " at" : ""}${go ? " go" : ""}`, title: `Attempt ${m.attempt}: ${m.word}`}, GLYPH[m.result]);
      if (go) square.addEventListener("click", event => { event.stopPropagation(); go(m.attempt); });
      return square;
    }));
}
const attemptMarks = attempts => attempts.map(a => ({attempt: a.attempt, result: kind(a.passed),
  word: a.cut ? "not trusted" : a.passed == null ? "no verdict" : a.passed ? "passed" : "failed"}));

function readAddress() {
  const hash = location.hash.slice(1), first = hash.split("&")[0];
  return new URLSearchParams(first && !first.includes("=") ? `id=${hash}` : hash);  // part 1's #<id>&attempt=<n>
}
const kept = {};  // the settings the address keeps, each unwritten at its default; a page adds its own
function writeAddress(params) {
  for (const [key, value] of Object.entries(kept)) { params.delete(key); if (value()) params.set(key, value()); }
  const hash = params.toString();
  history.replaceState(null, "", hash ? `#${hash}` : location.pathname + location.search);
}

// A panel with nothing to show, and the button that shows all of a panel's rows or fewer; `every`
// holds the panels showing all, by a key of the page's choice.
const every = new Set();
const emptyPanel = (title, text) => el("section", {className: "chart", "aria-label": title}, el("h3", {}, title), el("p", {className: "empty"}, text));
function moreButton(key, rows, redraw) {
  const all = every.has(key), button = el("button", {className: "more", type: "button"}, all ? "Show fewer" : `Show all ${rows}`);
  button.addEventListener("click", () => { all ? every.delete(key) : every.add(key); redraw(); });
  return button;
}

// A panel's message, in a line under its title.
function lede(section, text) {
  if (text) section.querySelector("h3").after(el("p", {className: "lede"}, text));
  return section;
}

// A scale from 0 that ends on a round value past `most`: its ticks are 1, 2 or 5 times a power of
// ten, four or five of them. Its panel's tracks draw a faint line at each tick.
function axis(most) {
  if (!(most > 0)) return {top: 0, step: 0, ticks: [0]};
  const rough = most / 4, power = 10 ** Math.floor(Math.log10(rough));
  const step = [1, 2, 5, 10].map(m => m * power).find(s => s >= rough);
  const top = Math.ceil(most / step - 1e-9) * step;
  return {top, step, ticks: Array.from({length: Math.round(top / step) + 1}, (_, i) => i * step)};
}
const gridStyle = a => a.step ? `--grid: ${a.step / a.top * 100}%` : null;
// The scale under a panel's rows: a label at each tick.
const scaleLine = (a, unit) => el("div", {className: "scale"}, el("span"),
  el("span", {className: "ticks"}, a.ticks.map(v => el("span", {style: `left: ${a.top ? v / a.top * 100 : 0}%`}, v ? unit(v) : "0"))), el("span"));

// The parts of tokens, their colours and their words.
const PARTS = ["cached", "input", "output", "thinking"];
const SEG = {cached: "cache", input: "input", output: "output", thinking: "thinking"};
const partWords = p => ({cached: "from the cache", input: p.cached == null ? "input" : "new input", output: "output", thinking: "thinking"});

// One tooltip for the page: what the mark under the pointer holds, as its data-tip says. The other
// parts of its bar fade while it is pointed at.
const tip = el("div", {className: "tip", role: "tooltip", hidden: true});
document.addEventListener("DOMContentLoaded", () => document.body.append(tip));
document.addEventListener("pointerover", event => {
  const mark = event.target instanceof Element ? event.target.closest("[data-tip]") : null;
  tip.hidden = !mark;
  if (mark) tip.textContent = mark.dataset.tip;
});
document.addEventListener("pointermove", event => {
  if (tip.hidden) return;
  tip.style.left = `${Math.max(8, Math.min(event.clientX + 14, innerWidth - tip.offsetWidth - 8))}px`;
  tip.style.top = `${event.clientY + 18 + tip.offsetHeight > innerHeight ? event.clientY - tip.offsetHeight - 10 : event.clientY + 18}px`;
});

</script>
</head>
<body>
<div class="page">
  <header id="head"></header>
  <div id="groups"></div>
  <div class="cmp" id="compare" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
</div>
<script>
// The index: runs grouped by agent, newest first, with a strip of each agent's pass rates.
const DATA = {"runs":2,"agents":[{"agent":"shop_bot","rows":[{"run":{"id":"2026-10-08T14-38-03_5e85","short":"5e85","agent":"shop_bot","version":"1.1","started":"2026-10-08T14:38:03.904085+03:00","status":"finished","user":"openai/gpt-5.6-luna","judge":"openai/gpt-5.6-luna","k":3,"scenarios":6,"unreadable":0,"trust":0.0,"confident":false},"rate":0.5555555555555556,"passed":10,"judged":18,"cut":0,"errors":0,"result":"flaky","changes":[],"order":0,"report":"shop_bot/2026-10-08T14-38-03_5e85/report.html"},{"run":{"id":"2026-10-08T13-55-00_7ad8","short":"7ad8","agent":"shop_bot","version":"1.0","started":"2026-10-08T13:55:00.826209+03:00","status":"finished","user":"openai/gpt-5.6-luna","judge":"openai/gpt-5.6-luna","k":3,"scenarios":6,"unreadable":0,"trust":0.0,"confident":false},"rate":1.0,"passed":18,"judged":18,"cut":0,"errors":0,"result":"passing","changes":[],"order":1,"report":"shop_bot/2026-10-08T13-55-00_7ad8/report.html"}]}]};
const RUNS = 5, BARS = 40;
const opened = new Set();  // agents whose older runs show
let picked = [];  // the runs ticked to compare, in the order ticked

function header() {
  return el("div", {className: "top"},
    el("div", {}, el("div", {className: "eyebrow"}, "CONVY"), el("h1", {}, "Runs"),
      el("p", {className: "meta"}, DATA.runs ? `${plural(DATA.runs, "run")} · ${plural(DATA.agents.length, "agent")}` : "No runs yet. Run convy run <agent> and they appear here.")),
    el("div", {className: "controls"}, themeButton()));
}

// What the agent's newest run is measured with.
const setup = run => [`user ${run.user}`, `judge ${run.judge}`, `${plural(run.scenarios, "scenario")} × ${run.k}`, run.trust > 0 && `trust ${run.trust}`].filter(Boolean).join(" · ");

// The agent's runs, newest left: a bar per run as high as its pass rate, coloured by its result,
// and a line where the setup changed.
function strip(group) {
  const rows = group.rows.slice(0, BARS);
  return el("div", {className: "strip", "aria-hidden": "true"}, rows.flatMap((row, i) => {
    const bar = el("span", {className: "bar", title: `${row.run.short} · ${when(row.run.started)} · ${row.judged ? `${pct(row.rate)}, ${row.passed} of ${row.judged}` : "no verdict"}${STATUS[row.run.status] ? ` · ${STATUS[row.run.status]}` : ""}`},
      el("span", {className: `fill ${row.result}${row.run.status === "finished" ? "" : " unfinished"}`, style: `height: ${row.rate == null ? 3 : Math.max(3, row.rate * 40)}px`}));
    return i && rows[i - 1].changes.length ? [el("span", {className: "brk"}), bar] : [bar];
  }));
}

// A run's line, and under it what of the setup changed since the agent's run before.
function line(row) {
  const run = row.run, state = STATUS[run.status];
  const box = el("input", {type: "checkbox", checked: picked.includes(row), "aria-label": `Compare run ${run.short}`, "data-id": run.id});
  box.addEventListener("change", () => pick(row, box.checked, run.id));
  const tr = el("tr", {},
    el("td", {}, box),
    el("td", {}, el("a", {className: "mono", href: row.report}, el("strong", {}, run.short))),
    el("td", {className: "rate"}, el("strong", {}, pct(row.rate)), el("span", {className: "muted"}, `${row.passed} of ${row.judged}${notTrusted(row.cut)}`), row.errors > 0 && el("span", {className: "errors"}, ` · ${plural(row.errors, "error")}`)),
    el("td", {className: "mono"}, run.version || "—"),
    el("td", {className: "muted"}, when(run.started), state && ` · ${state}`),
    el("td", {className: "rest"}));
  return row.changes.length ? [tr, el("tr", {className: "change"}, el("td", {}), el("td", {colSpan: 5}, `Changed: ${row.changes.join(" · ")}`))] : [tr];
}

function section(group) {
  const all = opened.has(group.agent), older = group.rows.length - RUNS;
  const rows = all ? group.rows : group.rows.slice(0, RUNS);
  const more = older > 0 && el("button", {className: "more", type: "button"}, all ? "Show fewer runs" : `Show ${plural(older, "older run")}`);
  if (more) more.addEventListener("click", () => { all ? opened.delete(group.agent) : opened.add(group.agent); draw(() => document.querySelector(`section[aria-label="${CSS.escape(group.agent)}"] .more`)); });
  const newest = group.rows[0].run;
  return el("section", {className: "panel group", "aria-label": group.agent},
    el("div", {className: "ghead"},
      el("div", {}, el("h2", {}, group.agent), el("span", {className: "sub"}, `${plural(group.rows.length, "run")} · last ${when(newest.started)}`), el("span", {className: "sub setup"}, setup(newest))),
      strip(group)),
    el("div", {className: "scroll"}, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {"aria-label": "Compare"}), el("th", {}, "Run"), el("th", {}, "Pass rate"), el("th", {}, "Version"), el("th", {}, "Started"), el("th", {className: "rest"}))),
      el("tbody", {}, rows.flatMap(line)))),
    more);
}

// Two ticked runs give the command that compares them, the older first; a third replaces the first.
function pick(row, on, id) {
  picked = picked.filter(r => r !== row);
  if (on) picked.push(row);
  if (picked.length > 2) picked.shift();
  draw(() => document.querySelector(`input[data-id="${CSS.escape(id)}"]`));
}
function compareBar() {
  const bar = document.getElementById("compare");
  if (picked.length < 2) return bar.replaceChildren();
  const [older, newer] = [...picked].sort((a, b) => b.order - a.order);
  const command = `convy compare ${older.run.id} ${newer.run.id}`;
  const code = el("code", {}, command);
  const copy = el("button", {className: "theme", type: "button"}, "Copy");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(command); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 2000); }
    catch { getSelection().selectAllChildren(code); copy.textContent = "Select and copy"; setTimeout(() => { copy.textContent = "Copy"; }, 2000); }  // no clipboard here: the command is selected to copy by hand
  });
  bar.replaceChildren(el("span", {}, "Compare them:"), code, copy);
}

// Redraws everything, then puts back the sideways scroll and the focus (find() gives the element to focus).
function draw(find) {
  const groups = document.getElementById("groups");
  const left = [...groups.querySelectorAll(".scroll")].map(div => div.scrollLeft);
  groups.replaceChildren(...(DATA.agents.length ? DATA.agents.map(section) : [el("p", {className: "empty"}, "Nothing to list.")]));
  groups.querySelectorAll(".scroll").forEach((div, i) => { div.scrollLeft = left[i] || 0; });
  compareBar();
  if (find) find()?.focus();
}

document.getElementById("head").replaceChildren(header());
document.getElementById("hint").textContent = "Tick two runs to compare them, or run: convy compare <before> <after>";
draw();
</script>
</body>
</html>
