<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparison</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318212f'/><circle cx='50' cy='50' r='28' fill='none' stroke='%23eef1f5' stroke-width='17'/><circle cx='50' cy='50' r='10' fill='%235fc48a'/></svg>">
<style>
:root {
  --page: #eef1f5; --surface: #ffffff; --side: #f4f6f9; --ink: #18212f; --muted: #4a5464;
  --rule: #d5dbe3; --user: #eef1f5; --focus: #2c4a74; --thought: #7a4fc4;
  --cache: #5d85ce; --input: #3a4aa7; --output: #bc7c40; --thinking: #8d58b7;
  --pass: #1a6b43; --pass-bg: #e3f2ea; --fail: #b3261e; --fail-bg: #f8e3e1;
  --flaky: #8a5100; --flaky-bg: #f6ecd9; --none: #4a5464; --none-bg: #e2e7ee; --on-status: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Noto Sans", "Adwaita Sans", Cantarell, "Helvetica Neue", Arial, "Liberation Sans", "DejaVu Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15181e; --surface: #171a21; --side: #1d212a; --ink: #e4e7ec; --muted: #a3abb8;
    --rule: #2e3440; --user: #232833; --focus: #9db4ff; --thought: #b69cf5;
    --cache: #7892d9; --input: #5061b3; --output: #b67f46; --thinking: #9970c4;
    --pass: #5fc48a; --pass-bg: #16301f; --fail: #ef7b70; --fail-bg: #3a1d1b;
    --flaky: #e0b155; --flaky-bg: #352a14; --none: #a3abb8; --none-bg: #262c36; --on-status: #171a21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #15181e; --surface: #171a21; --side: #1d212a; --ink: #e4e7ec; --muted: #a3abb8;
  --rule: #2e3440; --user: #232833; --focus: #9db4ff; --thought: #b69cf5;
  --cache: #7892d9; --input: #5061b3; --output: #b67f46; --thinking: #9970c4;
  --pass: #5fc48a; --pass-bg: #16301f; --fail: #ef7b70; --fail-bg: #3a1d1b;
  --flaky: #e0b155; --flaky-bg: #352a14; --none: #a3abb8; --none-bg: #262c36; --on-status: #171a21;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); }
.page { max-width: 1680px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 40px) 48px; }
.mono { font-family: var(--mono); }
.hint { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
.muted { color: var(--muted); }
.top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; margin-bottom: 18px; }
.top > div:first-child { flex: 1 1 320px; min-width: 0; }
.eyebrow { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
.eyebrow a { color: inherit; }
h1 { font-size: 22px; line-height: 1.25; margin: 8px 0 4px; font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.theme { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }

/* status icon, badge */
.si { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--on-status); font: 800 11px/1 var(--sans); flex: none; }
/* a status's colour, wherever a mark carries one: an icon, a square, a key, a bar */
:is(.si, .sq, .key, .fill, .meter > span).passing { background: var(--pass); }
:is(.si, .sq, .key, .fill, .meter > span).failing { background: var(--fail); }
:is(.si, .sq, .key, .fill, .meter > span).flaky { background: var(--flaky); }
:is(.si, .sq, .key, .fill, .meter > span).none { background: var(--none); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.badge.passing { background: var(--pass-bg); color: var(--pass); } .badge.failing { background: var(--fail-bg); color: var(--fail); }
.badge.flaky { background: var(--flaky-bg); color: var(--flaky); } .badge.none { background: var(--none-bg); color: var(--none); }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile .l { font-size: 12.5px; color: var(--muted); }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.tile .v small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.tile .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* table */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 32px 0 10px; }
.tools h2 { font-size: 16px; font-weight: 650; margin: 0 auto 0 0; }
input[type=search] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; width: 220px; max-width: 100%; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--side); }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric { font-size: 15px; font-weight: 650; }
.metric small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.open { all: unset; cursor: pointer; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
.open:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.empty { color: var(--muted); padding: 24px 12px; }

/* attempt squares */
.squares { display: inline-flex; flex-wrap: wrap; gap: 3px; max-width: 207px; vertical-align: middle; }
.sq { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font: 800 10px/1 var(--sans); color: var(--on-status); }
.sq.go { cursor: pointer; } .sq.at { outline: 2px solid var(--ink); outline-offset: 1px; }

/* the spread and change blocks */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin-top: 14px; }
.chart { background: var(--surface); padding: 14px 16px; min-width: 0; }
.chart .empty { margin: 0; padding: 4px 0; font-size: 13px; }
.chart h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
.chart .scale { display: grid; grid-template-columns: minmax(0, 16ch) minmax(0, 1fr) var(--tail, 8ch); gap: 4px 12px; align-items: center; }
.chart .caption { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }
.chart .scale { font-size: 13px; color: var(--muted); margin-top: 4px; }
.chart .scale > span { font-size: 11px; }
.chart .scale > span:nth-child(2):not(.ticks) { display: flex; justify-content: space-between; }
.chart .scale .ticks { display: block; position: relative; height: 1.3em; }
.chart .scale .ticks > span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart .scale .ticks > span:first-child { transform: none; } .chart .scale .ticks > span:last-child:not(:first-child) { transform: translateX(-100%); }
.chart.grid .ptrack { background-image: linear-gradient(to right, color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px); background-size: var(--grid) 100%; }
.more { all: unset; display: inline-block; cursor: pointer; color: var(--focus); font-size: 12.5px; margin-top: 8px; }
.more:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
@media (max-width: 760px) {
  .charts { grid-template-columns: minmax(0, 1fr); }
  .chart .scale { grid-template-columns: minmax(0, 1fr) var(--tail, 8ch); }
  .chart .scale > span:first-child { display: none; }
}

/* a lone panel takes the whole row */
.charts:has(> .chart:only-child) { grid-template-columns: minmax(0, 1fr); }

/* the statistic switch */
.switch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 18px 0 0; font-size: 13px; color: var(--muted); }
.switch [role=group] { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface); }
.switch button { all: unset; cursor: pointer; padding: 4px 12px; color: var(--ink); }
.switch button + button { border-left: 1px solid var(--rule); }
.switch button[aria-pressed="true"] { background: var(--focus); color: var(--surface); font-weight: 650; }
.switch button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* the key of a colour */
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* tokens by turn and by part: parts apart by a 2px gap of the panel's surface */
.charts:empty { display: none; }
.seg { flex: 1 1 0; min-width: 0; min-height: 0; border-radius: 2px; }
.seg.cache, .key.cache { background: var(--cache); } .seg.input, .key.input { background: var(--input); }
.seg.output, .key.output { background: var(--output); } .seg.thinking, .key.thinking { background: var(--thinking); }
.chart .ptrack { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-height: 16px; }

/* a change from before */
.delta { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--pass); } .delta.bad { color: var(--fail); } .delta.same, .delta.noise, .delta.none { color: var(--muted); }

/* a panel's message, the page's controls */
.lede { margin: -4px 0 10px; font-size: 14px; font-weight: 550; color: var(--ink); }
.controls { flex: 0 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; }
.controls .switch { margin: 0; }

/* the tooltip, and the parts of a bar fading beside the one pointed at */
.tip { position: fixed; z-index: 10; max-width: 340px; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 12.5px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 14px rgb(0 0 0 / .25); font-variant-numeric: tabular-nums; }
[data-tip] { cursor: default; }
.pbar:hover > .seg, .meter:hover > span, .bars:hover .seg { opacity: .35; transition: opacity .12s; }
.pbar:hover > .seg:hover, .meter:hover > span:hover, .bars:hover .seg:hover { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .pbar .seg, .meter > span, .bars .seg { transition: none; } }

/* what only the comparison draws: the hero tile, the spread tiles, the rows of changes, tokens by turn and by part */
.tile.hero .v { font-size: 36px; }
@media (max-width: 600px) { .tile.hero { grid-column: 1 / -1; } }
.block:has(> .charts:empty) { display: none; }
.block > .charts { margin-top: 0; }
.chart .rrow { display: grid; grid-template-columns: minmax(0, 16ch) minmax(0, 1fr) var(--tail, 8ch); gap: 4px 12px; align-items: center; }
.chart .rrow { font-size: 13px; min-height: 26px; border-radius: 6px; }
.chart .rid { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart .rrow .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) {
  .chart .rrow { grid-template-columns: minmax(0, 1fr) var(--tail, 8ch); }
  .chart .rrow .rid { grid-column: 1 / -1; }
}
/* tiles of a spread: its four statistics at the same size */
.tiles + .tiles { margin-top: 10px; }
.tiles.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.tile .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; margin: 4px 0; }
.tile .stats > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tile .stats .k { font-size: 11.5px; font-weight: 650; color: var(--muted); }
.tile .stats .v { font-size: 22px; }
@media (max-width: 480px) { .tile .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.chart h3 + .legend, .chart .lede + .legend { margin: 0 0 10px; }
.turns { position: relative; display: grid; grid-template-columns: auto; grid-auto-flow: column; grid-auto-columns: minmax(76px, 1fr); min-width: max-content; padding: 4px 0 2px; }
.turns .yaxis { display: grid; align-content: start; justify-items: end; gap: 4px; padding-right: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.turns .yaxis > div { position: relative; height: 160px; min-width: 4ch; }
.turns .yaxis .share { height: 1.6em; }
.turns .yaxis > div > span { position: absolute; right: 0; transform: translateY(50%); font-size: 11px; line-height: 1; }
.turns .bars { background-image: linear-gradient(to top, color-mix(in srgb, var(--rule) 70%, transparent) 1px, transparent 1px); background-size: 100% var(--grid, 100%); background-position: left bottom; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--rule) 70%, transparent); }
.turn { display: grid; justify-items: center; gap: 4px; font-size: 12px; }
.turn .share { height: 1.6em; display: flex; align-items: flex-end; font-weight: 650; font-variant-numeric: tabular-nums; }
.turn .bars { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; height: 160px; border-bottom: 1px solid var(--muted); }
.turn .bar { width: 24px; display: flex; flex-direction: column; gap: 2px; }
.turn .bar > .seg:first-child { border-radius: 4px 4px 1px 1px; }
.turn .tn { font-weight: 650; margin-top: 2px; }
.turn .sub { color: var(--muted); text-align: center; }
.turn.few .bars { opacity: .55; }
.pbar { display: flex; gap: 2px; height: 12px; min-width: 2px; }
.pbar.thin { height: 6px; }
.pbar > .seg:last-child { border-radius: 2px 4px 4px 2px; }
/* the scenario window */
dialog.window { width: calc(100vw - 48px); height: calc(100vh - 48px); max-width: 1400px; max-height: none; padding: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); color: var(--ink); overflow: hidden; }
dialog.window::backdrop { background: rgb(0 0 0 / .5); }
.frame { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.whead { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px 64px 14px 20px; border-bottom: 1px solid var(--rule); }
.whead h2 { margin: 0; font: 650 17px/1.3 var(--mono); overflow-wrap: anywhere; }
.close { position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.close:hover { border-color: var(--rule); }
.wbody { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
.side { background: var(--side); padding: 18px 20px; border-right: 1px solid var(--rule); overflow: auto; }
.main { padding: 16px 22px 24px; overflow: auto; min-width: 0; }
.sec { font-size: 12px; font-weight: 650; color: var(--muted); margin: 0 0 8px; }
.told { margin: 0 0 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.claims { list-style: none; margin: 0 0 18px; padding: 0; }
.claims li { display: grid; grid-template-columns: 22px 18px 1fr; gap: 2px 8px; margin: 0 0 14px; }
.claims .no, .judge .no { font: 650 13px/1.6 var(--mono); color: var(--muted); }
.claims .si, .judge .si { margin-top: 3px; }
.claims .tally { grid-column: 3; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.claims .tally .si { width: 15px; height: 15px; font-size: 9px; margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 6px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-size: 13px; }
.tab[aria-selected="true"] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); font-weight: 650; }
.mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
.mini > div { background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini .l { font-size: 12.5px; color: var(--muted); }
.mini .v { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mini .v.failing { color: var(--fail); } .mini .v.passing { color: var(--pass); } .mini .v.none { color: var(--none); }
.mini .s { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.judge { border: 1px solid var(--rule); border-radius: 12px; padding: 2px 16px; margin-bottom: 20px; }
.judge > div { display: grid; grid-template-columns: 22px 18px 1fr; gap: 0 8px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.judge > div:last-child { border-bottom: 0; }
.judge .why { line-height: 1.55; overflow-wrap: anywhere; }
.error { border-left: 3px solid var(--fail); padding: 8px 12px; margin-bottom: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg { max-width: min(72ch, 92%); margin: 16px 0; }
.who { font: 650 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
.msg.user .who { display: block; margin-bottom: 6px; }
.bubble { padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--user); border-top-left-radius: 4px; white-space: pre-wrap; }
.msg.agent { margin-left: auto; }
.msg.agent .bubble { background: var(--surface); border: 1px solid var(--rule); border-top-right-radius: 4px; }
.bhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: -2px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); font-size: 13px; line-height: 1.4; }
.bhead .who { margin-right: auto; }
.bhead .m { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.bhead svg { color: var(--muted); }
.bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; } .bubble li { margin: 4px 0; }
.bubble ol { list-style-position: inside; padding-left: 0; }
.bubble .h { font-weight: 700; }
.bubble code { font-family: var(--mono); font-size: 13.5px; background: var(--side); border-radius: 4px; padding: 1px 4px; }
@media (max-width: 860px) {
  .wbody { grid-template-columns: 1fr; overflow: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--rule); overflow: visible; }
  .main { overflow: visible; }
  .mini { grid-template-columns: 1fr; }
  dialog.window { width: 100vw; height: 100vh; border-radius: 0; }
}
@media print { dialog.window { position: static; } }

/* an answer's steps */
.bubble.flow { padding: 12px 14px; }
.msg.agent:has(.flow) { max-width: min(96ch, 96%); }
.link { all: unset; cursor: pointer; color: var(--focus); font-size: 13px; }
.link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.line { list-style: none; margin: 0; padding: 0; position: relative; }
.line::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 2px; background: var(--rule); }
.node { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; margin: 0 0 8px; }
.node:last-child { margin-bottom: 0; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--rule); color: var(--muted); z-index: 1; }
.node .card { border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); min-width: 0; }
.kind { font: 650 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.node.thought .card, .node.answer .card { padding: 9px 12px 10px; }
.node.thought .card > .kind, .node.answer .card > .kind { display: block; margin-bottom: 6px; }
.node.thought .dot, .node.thought .kind { color: var(--thought); }
.node.thought .dot { border-color: color-mix(in srgb, var(--thought) 55%, var(--rule)); }
.node.thought .card { background: color-mix(in srgb, var(--thought) 8%, var(--surface)); border-color: color-mix(in srgb, var(--thought) 28%, var(--rule)); }
.node.thought .said { white-space: pre-wrap; overflow-wrap: anywhere; }
.node.answer .dot { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 60%, var(--rule)); }
.node.answer .card { border-color: color-mix(in srgb, var(--ink) 25%, var(--rule)); }

  const r = byId.get(id);
  if (!r) return;
  address(id, number);
  const view = r.after ?? r.before;
  const close = el("button", {className: "close", type: "button", "aria-label": "Close"}, "✕");
  close.addEventListener("click", () => dialog.close());
  const most = Math.max(r.before ? r.before.attempts.length : 0, r.after ? r.after.attempts.length : 0, 1);
  const tabs = el("div", {className: "tabs", role: "tablist", "aria-label": "Attempts"}, Array.from({length: most}, (_, i) => {
    const tab = el("button", {className: "tab plain", type: "button", role: "tab", "aria-selected": String(i + 1 === number)}, `Attempt ${i + 1}`);
    tab.addEventListener("click", () => { show(id, i + 1); dialog.querySelector('[role=tab][aria-selected="true"]').focus(); });
    return tab;
  }));
  const claims = r.claims.length
    ? el("ol", {className: "claims"}, r.claims.map((c, i) => el("li", {}, el("span", {className: "no"}, String(i + 1)), icon(c.after), el("span", {}, c.text),
        el("span", {className: "tally"}, c.change === "unchanged" ? "unchanged" : [icon(c.before), "→", icon(c.after), c.change === "worse" ? "got worse" : "got better"],
          c.moved !== "unchanged" && el("span", {className: c.moved === "worse" ? "bad" : "good"}, `· ${c.was} → ${c.now}`)))))
    : el("p", {className: "told muted"}, r.why || "No claims to compare.");
  dialog.replaceChildren(el("div", {className: "frame"},
    el("div", {className: "whead"}, el("h2", {id: "window-title"}, r.id),
      r.before ? badge(r.before.result) : null, r.before && r.after ? el("span", {className: "arrow"}, "→") : null, r.after ? badge(r.after.result) : null,
      el("span", {className: "muted"}, `${BEFORE.short} → ${AFTER.short}`), close),
    el("div", {className: "wbody"},
      el("div", {className: "side"}, el("div", {className: "sec"}, "Claims · before → after"), claims,
        el("div", {className: "sec"}, "The user was told"), el("p", {className: "told"}, view.user)),
      el("div", {className: "main"}, tabs, el("div", {className: "cols"}, column("Before", BEFORE, r.before, number), column("After", AFTER, r.after, number))))));
  if (!dialog.open) dialog.showModal();
}

function draw() {
  document.getElementById("changes").replaceChildren(
    changes(`Time per answer · ${STAT[stat]}`, DATA.by_seconds[stat], "seconds", v => chosen(v.seconds), secs),
    changes(`Tokens per attempt · ${STAT[stat]}`, DATA.by_tokens[stat], "tokens", v => chosen(v.tokens), count));
  const turns = DATA.turns.length > 1, top = turnTop(DATA.turns.flatMap(p => [p.before, p.after].filter(Boolean)));
  document.getElementById("tokens").replaceChildren(...[
    turns && turnChart(`Tokens by turn · ${STAT[stat]} per answer · before ${BEFORE.short}`, DATA.turns.map(p => p.before ?? {turn: p.turn}), top),
    turns && turnChart(`Tokens by turn · ${STAT[stat]} per answer · after ${AFTER.short}`, DATA.turns.map(p => p.after ?? {turn: p.turn}), top),
    DATA.by_parts[stat].length > 0 && partPairs()].filter(Boolean));
  document.getElementById("table").replaceChildren(table());
}

document.title = `${BEFORE.short} → ${AFTER.short} · convy`;
document.getElementById("head").replaceChildren(header());
document.getElementById("tiles").replaceChildren(...tiles());
document.getElementById("filter").addEventListener("input", draw);
draw();
const opened = fromAddress();
if (opened) show(opened.id, opened.attempt);
</script>
</body>
</html>
